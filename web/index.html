<meta charset="utf-8">
<!-- Sans cette balise, le téléphone dessine la page en 980 px puis la réduit :
     tout devient minuscule et les cibles tactiles inutilisables. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier ARIA</title>
<meta name="description" content="Bras robotisé virtuel au cerveau en couches : il bouge seul et te répond par hochements de tête.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0d13;
    --bg2:#0c1017;
    --panel:rgba(17,23,32,.72);
    --panel-solid:#111720;
    --line:rgba(120,150,180,.18);
    --line-strong:rgba(120,150,180,.34);
    --text:#e6edf3;
    --muted:#8aa0b6;
    --dim:#5a6b7d;
    --cyan:#34d3ee;
    --amber:#f5a623;
    --green:#38e08a;
    --red:#ff5d5d;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --disp:"Chakra Petch",var(--sans);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;z-index:0;display:block;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}

  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud *{pointer-events:auto}

  /* Top bar */
  .topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 20px;gap:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .sigil{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--line-strong);border-radius:10px;
    display:grid;place-items:center;background:linear-gradient(160deg,rgba(52,211,238,.14),rgba(52,211,238,0));
    box-shadow:0 0 24px rgba(52,211,238,.12) inset}
  .sigil svg{width:22px;height:22px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.14em;margin:0;line-height:1}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:5px}
  .statuspill{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    backdrop-filter:blur(10px);letter-spacing:.03em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px currentColor;color:var(--cyan)}

  /* Brain panel */
  .brain{top:82px;right:20px;width:290px;max-width:calc(100vw - 40px);
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(12px);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .brain-head{padding:12px 15px 10px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;justify-content:space-between}
  .brain-head .t{font-family:var(--disp);font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .brain-head .st{font-family:var(--mono);font-size:12px;font-weight:500}
  .brain-body{padding:14px 15px}
  .thought{font-size:14px;line-height:1.45;min-height:42px;margin:0 0 14px;color:var(--text)}
  .thought .cursor{display:inline-block;width:7px;height:15px;background:var(--cyan);margin-left:1px;
    vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .meters{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
  .meter{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px}
  .meter label{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar>i{display:block;height:100%;width:50%;border-radius:99px;transition:width .5s ease}

  /* Log */
  .logwrap{border-top:1px solid var(--line);margin-top:4px}
  .logwrap .lh{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;padding:11px 15px 6px}
  .log{font-family:var(--mono);font-size:11.5px;line-height:1.5;padding:0 15px 14px;
    max-height:170px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
  .log .row{display:flex;gap:8px}
  .log .ts{color:var(--dim);flex:0 0 auto}
  .log .tag{flex:0 0 auto;font-weight:500}
  .log .msg{color:var(--muted)}
  .tag-reflexe{color:var(--dim)}
  .tag-decision{color:var(--cyan)}
  .tag-dialogue{color:var(--amber)}
  .tag-etat{color:var(--green)}

  /* Dock */
  .dock{left:50%;transform:translateX(-50%);bottom:20px;width:min(720px,calc(100vw - 32px));
    background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);
    padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  button.act{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid var(--line-strong);border-radius:10px;
    padding:9px 13px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px}
  button.act:hover{background:rgba(52,211,238,.12);border-color:var(--cyan)}
  button.act:active{transform:translateY(1px)}
  button.act .ic{font-size:14px;line-height:1}
  .toggle{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--mono);
    font-size:12px;color:var(--muted)}
  .sw{width:38px;height:21px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line-strong);
    position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
  .sw>i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--dim);transition:.2s}
  .sw.on{background:rgba(52,211,238,.28);border-color:var(--cyan)}
  .sw.on>i{left:19px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .aichip{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--dim);
    border:1px solid var(--line);border-radius:99px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
  .aichip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim);transition:.3s}
  .aichip.on{color:var(--cyan);border-color:rgba(52,211,238,.4)}
  .aichip.on::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .talk{display:flex;gap:8px}
  .talk input{flex:1;min-width:0;font-family:var(--sans);font-size:14px;color:var(--text);
    background:rgba(0,0,0,.28);border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;outline:none}
  .talk input::placeholder{color:var(--dim)}
  .talk input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(52,211,238,.12)}
  .talk button{font-family:var(--disp);letter-spacing:.08em;font-size:13px;font-weight:600;color:var(--bg);
    background:var(--cyan);border:none;border-radius:10px;padding:0 18px;cursor:pointer;transition:.16s}
  .talk button:hover{filter:brightness(1.08)}
  .talk button:active{transform:translateY(1px)}

  /* Fiche pièce / catalogue */
  .sheet{position:fixed;top:0;left:0;bottom:0;z-index:5;width:min(384px,94vw);
    background:var(--panel-solid);border-right:1px solid var(--line-strong);
    box-shadow:24px 0 70px rgba(0,0,0,.55);transform:translateX(-102%);
    transition:transform .28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .sheet.open{transform:none}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-family:var(--disp);font-size:16px;letter-spacing:.05em;margin:0;flex:1;text-wrap:balance;line-height:1.2}
  .sheet-head .x{background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:8px;
    width:30px;height:30px;flex:0 0 auto;cursor:pointer;font-size:15px;line-height:1}
  .sheet-head .x:hover{color:var(--text);border-color:var(--cyan)}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    padding:4px 9px;border-radius:99px;border:1px solid var(--line-strong);width:max-content}
  .cat.impression{color:var(--cyan);border-color:rgba(52,211,238,.4)}
  .cat.achat{color:var(--amber);border-color:rgba(245,166,35,.4)}
  .cat.electronique{color:var(--green);border-color:rgba(56,224,138,.4)}
  .zoom{width:100%;aspect-ratio:4/3;border-radius:12px;border:1px solid var(--line);background:#0a0d13;
    display:grid;place-items:center;overflow:hidden}
  .zoom img{width:100%;height:100%;object-fit:contain}
  .zoom .ph{color:var(--dim);font-family:var(--mono);font-size:12px;text-align:center;padding:14px;line-height:1.5}
  .modelview{position:absolute;inset:0;cursor:grab}
  .modelview canvas{width:100%!important;height:100%!important;display:block}
  .mv-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);
    font-family:var(--mono);font-size:12px;pointer-events:none}
  .mv-tag{position:absolute;left:8px;bottom:8px;color:var(--muted);font-family:var(--mono);
    font-size:10px;letter-spacing:.04em;background:rgba(6,9,14,.6);padding:3px 7px;border-radius:6px;
    pointer-events:none}
  .memlist{display:flex;flex-direction:column;gap:4px}
  .memrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
    background:rgba(255,255,255,.035);border:1px solid var(--line)}
  .memrow .mk{color:var(--cyan);font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;flex:0 0 auto;min-width:74px}
  .memrow .mv{color:var(--text);font-size:13px;word-break:break-word}
  .memrow .mt{color:var(--dim);font-family:var(--mono);font-size:10px;flex:0 0 auto}
  .memrow .mx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;
    padding:2px 4px;border-radius:5px;flex:0 0 auto}
  .memrow .mx:hover{color:#ff6b6b;background:rgba(255,107,107,.12)}
  .memlog{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto}
  .mlrow{display:flex;gap:8px;font-size:12.5px;line-height:1.45;padding:3px 0}
  .mlrow .who{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;padding-top:2px;min-width:34px}
  .mlrow.me .who{color:var(--muted)} .mlrow.aria .who{color:var(--cyan)}
  .modtog{display:flex;flex-direction:column;gap:2px}
  .modrow{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--text)}
  .modrow:hover{background:rgba(255,255,255,.04)}
  .modrow input{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer;flex:0 0 auto}
  .blk h3{font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .blk p{margin:0;font-size:13.5px;line-height:1.55}
  .kvgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  .kvgrid .k{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;align-self:center}
  .blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .blk li{font-size:13px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
  .blk li:last-child{border-bottom:none}
  .blk li .q{font-family:var(--mono);color:var(--muted);flex:0 0 auto}
  .blk li .w{color:var(--dim);font-size:12px}
  .dl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--cyan);text-decoration:none;
    border:1px solid rgba(52,211,238,.35);border-radius:9px;padding:8px 12px;width:max-content}
  .dl:hover{background:rgba(52,211,238,.1)}
  .sheet-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
  .sheet-foot button{flex:1;font-family:var(--sans);font-size:13px;font-weight:500;border-radius:9px;padding:10px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid var(--line-strong);color:var(--text)}
  .sheet-foot button:hover{border-color:var(--cyan)}
  .sheet-foot button.pri{background:var(--cyan);color:var(--bg);border:none;font-weight:600}
  .sheet-foot button.danger:hover{border-color:var(--red);color:var(--red)}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .field input,.field textarea,.field select{background:rgba(0,0,0,.28);border:1px solid var(--line-strong);
    border-radius:8px;padding:8px 10px;color:var(--text);font:13px var(--sans);outline:none;width:100%}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan)}
  .field textarea{resize:vertical;min-height:54px;font-family:var(--mono);font-size:12px;line-height:1.5}
  .field .hlp{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .uprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;font-size:12px;
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--text)}
  .filebtn:hover{border-color:var(--cyan)}
  .filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upst{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
    cursor:pointer;background:rgba(255,255,255,.02);text-align:left}
  .pitem:hover{border-color:var(--cyan);background:rgba(52,211,238,.06)}
  .pitem .nm{flex:1;font-size:13px}
  .pitem .cd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .ronote{font-size:12px;color:var(--amber);font-family:var(--mono);background:rgba(245,166,35,.08);
    border:1px solid rgba(245,166,35,.3);border-radius:8px;padding:9px 11px;line-height:1.5}

  .hint{position:fixed;left:20px;bottom:22px;z-index:2;font-family:var(--mono);font-size:11px;
    color:var(--dim);max-width:220px;line-height:1.5;pointer-events:none}
  @media (max-width:900px){
    .brain{position:fixed;top:auto;bottom:150px;right:12px;left:12px;width:auto}
    .log{max-height:110px}
    .hint{display:none}
  }
  @media (max-width:900px) and (max-height:720px){ .brain{display:none} }
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* ============ DA JARVIS : HUD holographique ============ */
  /* Cadre d'angles */
  .fx-frame{position:fixed;inset:14px;z-index:1;pointer-events:none}
  .fx-frame i{position:absolute;width:34px;height:34px;border:2px solid rgba(52,211,238,.45);filter:drop-shadow(0 0 6px rgba(52,211,238,.4))}
  .fx-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  .fx-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  .fx-frame i:nth-child(3){bottom:0;right:0;border-left:0;border-top:0}
  .fx-frame i:nth-child(4){bottom:0;left:0;border-right:0;border-top:0}
  /* Scanline */
  .fx-scan{position:fixed;left:0;right:0;top:0;height:2px;z-index:1;pointer-events:none;opacity:.5;
    background:linear-gradient(90deg,transparent,rgba(52,211,238,.55),transparent);animation:scanmove 7s linear infinite}
  @keyframes scanmove{0%{transform:translateY(-4px)}100%{transform:translateY(100vh)}}
  /* Réticule décoratif */
  .fx-reticle{position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);z-index:1;pointer-events:none;
    width:min(78vmin,760px);height:min(78vmin,760px)}
  .fx-reticle span{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(52,211,238,.10);animation:spin 70s linear infinite}
  .fx-reticle span:nth-child(2){inset:13%;border-style:solid;border-color:rgba(52,211,238,.06);animation:spinrev 100s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinrev{to{transform:rotate(-360deg)}}
  /* Étiquette de survol */
  .hlabel{position:fixed;z-index:6;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--cyan);background:rgba(10,16,22,.82);border:1px solid rgba(52,211,238,.5);padding:4px 10px;white-space:nowrap;
    box-shadow:0 0 16px rgba(52,211,238,.25);backdrop-filter:blur(4px);
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
  /* HUD d'analyse : anneaux + cartouches ancrés à la pièce, façon poste de pilotage */
  .hud3d{position:fixed;inset:0;z-index:7;pointer-events:none}
  /* en analyse, l'interface courante s'efface pour laisser la pièce respirer */
  body.analysing .hud.brain,body.analysing .telemetry,body.analysing .hint{
    opacity:.12;transition:opacity .3s}
  body.analysing .hud.dock{opacity:.35;transition:opacity .3s}
  body.analysing .hud.dock:hover{opacity:1}
  .hud3d svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .hud3d .ringline{fill:none;stroke:var(--cyan);stroke-width:1}
  .hud3d .tick{stroke:var(--cyan);stroke-width:1;opacity:.55}
  .hud3d .lead{stroke:var(--cyan);stroke-width:1;opacity:.7;stroke-dasharray:3 3}
  .hud3d .node{fill:var(--cyan)}
  .hcard{position:absolute;pointer-events:auto;min-width:124px;max-width:212px;
    background:rgba(7,12,19,.82);backdrop-filter:blur(9px);
    border:1px solid rgba(52,211,238,.4);border-radius:9px;padding:7px 10px 8px;
    box-shadow:0 0 22px rgba(52,211,238,.14);transform:translate(-50%,-50%);
    /* l'opacité ne dépend PAS de l'animation : si celle-ci ne se joue pas
       (mouvement réduit, appareil lent), le cartouche reste lisible. */
    animation:hudin .26s cubic-bezier(.2,.8,.3,1) both}
  @keyframes hudin{from{transform:translate(-50%,-50%) scale(.9)}
                     to{transform:translate(-50%,-50%) scale(1)}}
  .hcard h4{margin:0 0 5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--cyan);font-weight:600}
  .hcard .hr{display:flex;justify-content:space-between;gap:9px;font-size:11.5px;
    line-height:1.45;color:var(--text)}
  .hcard .hr span:last-child{color:var(--muted);text-align:right;flex:0 0 auto}
  .hcard p{margin:0;font-size:11.5px;line-height:1.45;color:var(--text)}
  .hcard.title{border-color:var(--cyan);box-shadow:0 0 26px rgba(52,211,238,.3)}
  .hcard.title h4{font-size:12.5px;letter-spacing:.06em;color:#fff;text-transform:none;margin:0}
  .hcard .cat{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted)}
  .hcard button{margin-top:7px;width:100%;background:rgba(52,211,238,.14);color:var(--cyan);
    border:1px solid rgba(52,211,238,.45);border-radius:7px;padding:5px 8px;font-size:11px;
    font-family:var(--mono);letter-spacing:.05em;cursor:pointer}
  .hcard button:hover{background:rgba(52,211,238,.26)}
  .gold .hud3d .ringline,.gold .hud3d .tick,.gold .hud3d .lead{stroke:#f5b83d}
  .gold .hud3d .node{fill:#f5b83d}
  .gold .hcard{border-color:rgba(245,184,61,.42)}
  .gold .hcard h4{color:#f5b83d}
  @media (max-width:720px){ .hcard{max-width:168px;min-width:108px;padding:6px 8px}
    .hcard p,.hcard .hr{font-size:10.5px} }
  .hlabel::before{content:'';position:absolute;left:-7px;top:50%;width:6px;height:1px;background:var(--cyan)}
  /* Panneaux : verre à coins biseautés + ligne d'accent */
  .statuspill,.brain,.dock{--cut:12px;border-color:rgba(52,211,238,.28);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .brain,.dock{box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 42px rgba(52,211,238,.045)}
  .brain::before,.dock::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
  .brand h1{text-shadow:0 0 18px rgba(52,211,238,.45)}
  button.act:hover{box-shadow:0 0 14px rgba(52,211,238,.22)}
  /* Fiche : holographique */
  .sheet{border-right:1px solid rgba(52,211,238,.45);
    box-shadow:24px 0 70px rgba(0,0,0,.6),inset -1px 0 34px rgba(52,211,238,.05);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
  .sheet-head{position:relative}
  .sheet-head h2{text-shadow:0 0 16px rgba(52,211,238,.35)}
  .sheet-head::after{content:'';position:absolute;left:18px;right:18px;bottom:-1px;height:1px;transform-origin:left;
    background:linear-gradient(90deg,var(--cyan),transparent);animation:grow .5s ease both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .zoom{position:relative}
  .zoom::after{content:'';position:absolute;left:0;right:0;height:45%;top:-45%;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(52,211,238,.14),transparent);animation:zscan 3.4s ease-in-out infinite}
  @keyframes zscan{0%{top:-45%}60%,100%{top:100%}}
  /* Révélation en cascade du contenu de la fiche */
  .sheet.open .sheet-body>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .sheet.open .sheet-body>*:nth-child(1){animation-delay:.04s}
  .sheet.open .sheet-body>*:nth-child(2){animation-delay:.09s}
  .sheet.open .sheet-body>*:nth-child(3){animation-delay:.14s}
  .sheet.open .sheet-body>*:nth-child(4){animation-delay:.19s}
  .sheet.open .sheet-body>*:nth-child(5){animation-delay:.24s}
  .sheet.open .sheet-body>*:nth-child(6){animation-delay:.29s}
  .sheet.open .sheet-body>*:nth-child(7){animation-delay:.34s}
  .sheet.open .sheet-body>*:nth-child(n+8){animation-delay:.38s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* Écran de démarrage */
  .boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 48%,#0c1119,#06090e);transition:opacity .8s ease}
  .boot.done{opacity:0;pointer-events:none}
  .boot-ring{position:absolute;width:158px;height:158px;border-radius:50%;border:2px solid rgba(52,211,238,.22);
    border-top-color:var(--cyan);box-shadow:0 0 30px rgba(52,211,238,.25);animation:spin 1s linear infinite}
  .boot-t{font-family:var(--disp);font-weight:700;letter-spacing:.42em;font-size:26px;color:var(--cyan);
    text-shadow:0 0 26px rgba(52,211,238,.55);animation:flick 1.6s ease both}
  .boot-s{position:absolute;top:calc(50% + 58px);font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted)}
  @keyframes flick{0%{opacity:0}18%{opacity:.5}24%{opacity:.1}42%{opacity:1}48%{opacity:.4}100%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .fx-scan,.fx-reticle span,.boot-ring,.zoom::after,.sheet-head::after,.sheet.open .sheet-body>*{animation:none!important}
  }

  /* Ligne de connexion pièce -> fiche */
  .fx-leader{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}
  .fx-leader line{stroke:var(--cyan);stroke-width:1.3;stroke-dasharray:4 5;opacity:.75}
  .fx-leader circle{fill:var(--cyan)}
  /* Télémétrie live */
  .telemetry{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:2;
    font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);padding:12px 14px;min-width:158px;backdrop-filter:blur(10px);
    --cut:10px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .telemetry .tl-h{font-family:var(--disp);font-size:10px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px}
  .telemetry .tl-row{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
  .telemetry .tl-row b{color:var(--cyan);font-weight:500;font-variant-numeric:tabular-nums}
  .telemetry .tl-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
  .telemetry .tl-bar>i{display:block;height:100%;background:var(--cyan);width:50%;transition:width .4s ease}
  .act.active{background:rgba(52,211,238,.16);border-color:var(--cyan);color:var(--cyan)}
  /* Mode Or (Mark) : bascule l'accent partout où var(--cyan) est utilisé */
  :root.gold{--cyan:#f5b83d}
  .gold .fx-frame i{border-color:rgba(245,184,61,.5)}
  .gold .fx-scan{background:linear-gradient(90deg,transparent,rgba(245,184,61,.55),transparent)}
  .gold .fx-reticle span{border-color:rgba(245,184,61,.12)}
  .gold .hlabel{color:#f5b83d;border-color:rgba(245,184,61,.5);box-shadow:0 0 16px rgba(245,184,61,.25)}
  .gold .act.active{background:rgba(245,184,61,.16)}
  @media (max-width:900px){ .telemetry{display:none} .fx-leader{display:none} }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function(){
"use strict";
const THREE = window.THREE;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Scène ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x0a0d13, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0d13, 16, 40);

// Environnement de reflets (studio procédural) : c'est ce qui rend le métal argent/chrome
function makeEnvTexture(){
  const c=document.createElement('canvas'); c.width=32; c.height=128; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0.00,'#9fb4d6');  // ciel clair (reflet haut lumineux)
  grd.addColorStop(0.34,'#5a6a82');
  grd.addColorStop(0.50,'#2a323d');  // horizon
  grd.addColorStop(0.52,'#171c23');
  grd.addColorStop(1.00,'#0a0d13');  // sol sombre
  g.fillStyle=grd; g.fillRect(0,0,32,128);
  // bande "softbox" brillante pour des reflets marqués
  g.fillStyle='rgba(255,255,255,0.5)'; g.fillRect(0,18,32,10);
  const t=new THREE.CanvasTexture(c); t.mapping=THREE.EquirectangularReflectionMapping; return t;
}
const _pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = _pmrem.fromEquirectangular(makeEnvTexture()).texture;

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const orbit = {theta:0.7, phi:1.06, r:15.5, target:new THREE.Vector3(0,3.4,0)};

/* Lumières */
scene.add(new THREE.HemisphereLight(0xbcd2f0, 0x141a22, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(5,9,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5); fill.position.set(-6,4,6); scene.add(fill);
const rimC = new THREE.PointLight(0x34d3ee, 0.8, 30); rimC.position.set(-6,3,-3); scene.add(rimC);
const rimA = new THREE.PointLight(0xf5a623, 0.45, 24); rimA.position.set(5,1.5,-5); scene.add(rimA);

/* Sol : grille holo + disque */
const grid = new THREE.GridHelper(40, 40, 0x2b4a63, 0x16222f);
grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
const floorGeo = new THREE.CircleGeometry(18, 48);
const floorMat = new THREE.MeshStandardMaterial({color:0x0c1119, roughness:0.95, metalness:0.1});
const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI/2; floor.position.y = -0.01; scene.add(floor);

function radialTexture(hex){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const col = new THREE.Color(hex);
  const r = Math.round(col.r*255), gg = Math.round(col.g*255), b = Math.round(col.b*255);
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0, `rgba(${r},${gg},${b},1)`);
  grad.addColorStop(0.4, `rgba(${r},${gg},${b},.5)`);
  grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* Ombre de contact factice */
const shadowTex = radialTexture(0x000000);
const shadowMat = new THREE.SpriteMaterial({map:shadowTex, color:0x000000, opacity:0.5, transparent:true, depthWrite:false});
const shadowSpr = new THREE.Sprite(shadowMat); shadowSpr.scale.set(3.4,3.4,1);
shadowSpr.position.set(0,0.02,0); shadowSpr.material.rotation = 0;
const shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(2.3,44),
  new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:0.55, depthWrite:false, color:0x000000}));
shadowMesh.rotation.x = -Math.PI/2; shadowMesh.position.y = 0.015; scene.add(shadowMesh);

/* ---------- Le corps (Body) : bras industriel 6 axes ---------- */
const matMetal = new THREE.MeshStandardMaterial({color:0xdfe4ec, metalness:0.9, roughness:0.28, envMapIntensity:1.4});  // métal chrome clair
const matGrey  = new THREE.MeshStandardMaterial({color:0xaab2c0, metalness:0.8, roughness:0.4, envMapIntensity:1.2});   // panneaux
const matDark  = new THREE.MeshStandardMaterial({color:0x39424e, metalness:0.7, roughness:0.45, envMapIntensity:1.0});  // articulations
const matHose  = new THREE.MeshStandardMaterial({color:0x14181d, metalness:0.1, roughness:0.85});   // câbles/gaines
const matAccent= new THREE.MeshStandardMaterial({color:0x34d3ee, emissive:0x34d3ee, emissiveIntensity:0.9, metalness:0.3, roughness:0.4});

function box(w,h,d,mat,id){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat||matMetal); if(id) m.userData.partId=id; return m; }
function cyl(rt,rb,h,mat,id,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24), mat||matMetal); if(id) m.userData.partId=id; return m; }
function ring(r,tube){ const t=new THREE.Mesh(new THREE.TorusGeometry(r,tube||0.05,12,32), matAccent); t.rotation.x=Math.PI/2; return t; }
// Cylindre couché sur l'axe X (axe d'articulation)
function axis(r,len,mat,id){ const m=cyl(r,r,len,mat||matDark,id,24); m.rotation.z=Math.PI/2; return m; }
// Gaine de câble le long de points locaux
function hose(points,r){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
  return new THREE.Mesh(new THREE.TubeGeometry(curve,28,r||0.05,8,false), matHose);
}

/* Plaque plate à bouts arrondis ("os") : la signature visuelle du Moveo.
   Longueur selon +Y, épaisseur selon Z. r1 = rayon du bout bas, r2 = bout haut. */
function bonePlate(len, r1, r2, th, mat, id){
  const s = new THREE.Shape();
  s.moveTo(r1, 0);
  s.lineTo(r2, len);
  s.absarc(0, len, r2, 0, Math.PI, false);
  s.lineTo(-r1, 0);
  s.absarc(0, 0, r1, Math.PI, Math.PI*2, false);
  const g = new THREE.ExtrudeGeometry(s, {depth:th, bevelEnabled:true, bevelThickness:th*0.14,
    bevelSize:th*0.14, bevelSegments:2, curveSegments:26});
  g.translate(0, 0, -th/2);
  const m = new THREE.Mesh(g, mat||matMetal);
  if(id) m.userData.partId = id;
  return m;
}
// Deux flasques parallèles (structure ouverte du Moveo) + entretoise
function forkSegment(parent, len, r1, r2, th, halfWidth, id){
  [-halfWidth, halfWidth].forEach(x=>{
    const p = bonePlate(len, r1, r2, th, matMetal, id);
    p.rotation.y = Math.PI/2;            // épaisseur selon X -> flasque latéral
    p.position.x = x;
    parent.add(p);
  });
  const brace = box(halfWidth*1.7, len*0.42, th*1.2, matGrey, id);
  brace.position.y = len*0.5; parent.add(brace);
}
// Moteur pas-à-pas (corps carré NEMA)
function nema(size, mat, id){
  const m = box(size, size, size, mat||matDark, id);
  return m;
}

const root = new THREE.Group(); scene.add(root);

// --- Socle fixe : plateau + embase ---
const plate = box(3.2, 0.14, 3.2, matDark); plate.position.y=0.07; plate.userData.partId='base'; root.add(plate);
const base = cyl(1.08, 1.18, 0.32, matGrey, 'base'); base.position.y=0.3; root.add(base);
base.add(ring(0.98, 0.04));

// --- Axe 1 : colonne tournante (yaw) ---
const yawG = new THREE.Group(); yawG.position.y=0.46; root.add(yawG);
const waist = cyl(0.86, 0.92, 1.12, matMetal, 'yaw'); waist.position.y=0.56; yawG.add(waist);
const topFlange = cyl(0.99, 0.99, 0.1, matGrey, 'yaw'); topFlange.position.y=1.17; yawG.add(topFlange);
for(let i=0;i<8;i++){                                  // cercle de boulons du plateau tournant
  const a=i/8*Math.PI*2, b=cyl(0.05,0.05,0.13,matDark,'yaw',10);
  b.position.set(Math.cos(a)*0.8, 1.2, Math.sin(a)*0.8); yawG.add(b);
}
// Chape d'épaule : deux flasques verticaux qui montent vers l'axe 2
const SH_Y = 1.95;
[-0.54, 0.54].forEach(x=>{
  const p = bonePlate(SH_Y-1.22, 0.34, 0.44, 0.17, matMetal, 'yaw');
  p.rotation.y = Math.PI/2; p.position.set(x, 1.22, 0); yawG.add(p);
});
const m1 = nema(0.62, matDark, 'shoulder'); m1.position.set(0.95, SH_Y-0.3, 0); yawG.add(m1);

// --- Axe 2 : épaule (pitch) ---
const shoulderG = new THREE.Group(); shoulderG.position.set(0, SH_Y, 0); yawG.add(shoulderG);
shoulderG.add(axis(0.34, 1.24, matDark, 'shoulder'));
[-0.56, 0.56].forEach(x=>{ const c=cyl(0.36,0.36,0.1,matMetal,'shoulder'); c.rotation.z=Math.PI/2; c.position.x=x; shoulderG.add(c); });

// --- Bras supérieur : épaule -> coude (200 mm) ---
const L1=2.4;
const upper = new THREE.Group(); shoulderG.add(upper);
forkSegment(upper, L1, 0.36, 0.30, 0.15, 0.44, 'upper');
upper.add(hose([[-0.36,0.2,-0.2],[-0.32,1.0,-0.26],[-0.34,1.8,-0.22],[-0.3,2.25,-0.16]],0.055));
const m2 = nema(0.44, matDark, 'elbow'); m2.position.set(0.56, L1-0.42, 0); upper.add(m2);

// --- Axe 3 : coude (pitch) ---
const elbowG = new THREE.Group(); elbowG.position.y=L1; upper.add(elbowG);
elbowG.add(axis(0.28, 1.0, matDark, 'elbow'));
[-0.46, 0.46].forEach(x=>{ const c=cyl(0.3,0.3,0.08,matMetal,'elbow'); c.rotation.z=Math.PI/2; c.position.x=x; elbowG.add(c); });

// --- Avant-bras : coude -> poignet (190 mm) ---
const L2=2.3;
const fore = new THREE.Group(); elbowG.add(fore);
forkSegment(fore, L2, 0.3, 0.24, 0.13, 0.34, 'forearm');
fore.add(hose([[0.28,0.18,-0.18],[0.25,0.9,-0.22],[0.26,1.6,-0.18],[0.22,2.05,-0.14]],0.048));
const m3 = nema(0.34, matDark, 'wrist'); m3.position.set(-0.44, L2-0.36, 0); fore.add(m3);

// --- Axes 4/5 : poignet (pitch / yaw / roll) ---
const wristG = new THREE.Group(); wristG.position.y=L2; wristG.rotation.order='YXZ'; fore.add(wristG);
const wrist1 = cyl(0.28,0.3,0.44,matDark,'wrist'); wrist1.position.y=0.22; wristG.add(wrist1);
wrist1.add(ring(0.26,0.03));
const wrist2 = cyl(0.24,0.24,0.34,matMetal,'wrist'); wrist2.position.y=0.56; wristG.add(wrist2);

// Œil / capteur (garde l'expression + l'humeur)
const eyeMat = new THREE.MeshStandardMaterial({color:0x34d3ee, emissive:0x34d3ee, emissiveIntensity:1.3, roughness:0.3});
const eyePod = cyl(0.13,0.15,0.14,matDark,'eye'); eyePod.rotation.x=Math.PI/2; eyePod.position.set(0,0.52,0.26); wristG.add(eyePod);
const eye = new THREE.Mesh(new THREE.SphereGeometry(0.095,18,14), eyeMat); eye.position.set(0,0.52,0.35); eye.userData.partId='eye'; wristG.add(eye);

const fingers = [];
[0, Math.PI].forEach(a=>{

[[-0.11,0.1,0],[0.11,0.1,0]].forEach(p=>{ const g=cyl(0.085,0.085,0.055,matDark,'head'); g.position.set(p[0],p[1],p[2]); headG.add(g); }); // engrenages servo

/* ---------- Assemblage des vraies pièces imprimées (STL) ----------
   Chaque module réel est monté sur le même groupe cinématique que le
   bras stylisé, donc il bouge pareil. Échelle réelle UNIFORME (mm -> unités
   scène) pour garder les vraies proportions. Config data-driven : on ajuste
   position/rotation pièce par pièce sans toucher au reste. */
const deg = d => d*Math.PI/180;
// Vraies amplitudes articulaires du bras (guide TomKnox, en degrés -> radians)
const JLIM = {
  base:     [deg(-60), deg(90)],
  shoulder: [deg(-110), deg(110)],
  elbow:    [deg(-60), deg(90)],
  wrist1:   [deg(-60), deg(90)],
  wrist2:   [deg(-60), deg(90)],
};
const ASM_SCALE = 0.0125;                 // ~1 unité = 80 mm
// Longueurs réelles des segments (mm réels * ASM_SCALE) : épaule->coude 200,
// coude->poignet 190, poignet->pince 130. Utilisées seulement en vue assemblée.
const LINK_REAL = { elbow: 200*ASM_SCALE, wrist: 190*ASM_SCALE, head: 130*ASM_SCALE };
const ASM_GROUPS = { root, yawG, upper, fore, wristG, headG };
// grp: groupe animé | p:[x,y,z] position du centre (unités scène) | r:[x,y,z] rotation deg | id: module (survol/focus)
// Pieces authored Y-up (les grosses pieces ont leur longueur en Y) -> pas de rot par defaut.
// off:true = chargee mais masquee (secondaire/orientation incertaine, togglable plus tard).
const ASM = [
  // Module 1 - socle + rotation base
  {code:'0007-0801', grp:'root',  id:'base', p:[0,0.5,0],  r:[0,0,0]},
  {code:'0007-0103', grp:'yawG',  id:'yaw',  p:[0,0.35,0], r:[0,0,0]},
  {code:'0007-0101', grp:'yawG',  id:'yaw',  p:[0,0.85,0], r:[0,0,0]},
  {code:'0007-0102', grp:'yawG',  id:'yaw',  p:[0,1.15,0], r:[0,0,0], off:true},
  // Module 2 - epaule / bras superieur (grp upper, +Y jusqu'a L1=2.4)
  {code:'0007-0201', grp:'upper', id:'upper', p:[0,1.25,0], r:[0,0,0]},
  {code:'0007-0202', grp:'upper', id:'upper', p:[0.5,0.6,0],  r:[0,0,0], off:true},
  {code:'0007-0203', grp:'upper', id:'upper', p:[-0.5,0.6,0], r:[0,0,0], off:true},
  // Module 3 - avant-bras (grp fore, +Y jusqu'a L2=2.0)
  {code:'0007-0301', grp:'fore',  id:'forearm', p:[0,1.19,0], r:[0,0,0]},
  {code:'0007-0302', grp:'fore',  id:'forearm', p:[0.45,0.5,0],  r:[0,0,0], off:true},
  {code:'0007-0303', grp:'fore',  id:'forearm', p:[-0.45,0.5,0], r:[0,0,0], off:true},
  // Module 4 - poignet (grp wristG)
  {code:'0007-0401', grp:'wristG', id:'wrist', p:[0,0.81,0], r:[0,0,0]},
  // Module 5 - pince (grp headG)
  {code:'0007-0501', grp:'headG', id:'head', p:[0,0.15,0], r:[0,0,0]},
  {code:'0007-0508', grp:'headG', id:'head', p:[0,0.3,0],  r:[0,0,0], off:true},
  {code:'0007-0503', grp:'headG', id:'head', p:[0.18,0.5,0],  r:[0,0,0]},
  {code:'0007-0504', grp:'headG', id:'head', p:[-0.18,0.5,0], r:[0,0,0]},
];
// Plastique imprimé sombre, comme les vraies pièces ABS/PETG des photos du guide.
const matPart = new THREE.MeshStandardMaterial({color:0x4a505a, metalness:0.15, roughness:0.62, envMapIntensity:0.75});
let asmBuilt=false, assemblyOn=false, showDetail=false;
const asmMeshes=[];
const hiddenModules=new Set();     // partIds masqués par l'utilisateur (panneau Modules)
// Modules affichables dans le panneau (vue réelle)
const MODULES=[
  {id:'base',    label:'Socle + rotation base'},
  {id:'yaw',     label:'Base tournante'},
  {id:'upper',   label:'Épaule / bras supérieur'},
  {id:'forearm', label:'Avant-bras'},
  {id:'wrist',   label:'Poignet'},
  {id:'head',    label:'Pince / tête'},
];
function asmVisible(m){
  return assemblyOn && !hiddenModules.has(m.userData.partId) && (!m.userData.off || showDetail);
}
function applyAsmVisibility(){
  asmMeshes.forEach(m=>{ m.visible = asmVisible(m); });
}
function buildAssembly(){
  if(asmBuilt || !window.THREE || !THREE.STLLoader) return;
  asmBuilt=true;
  const loader=new THREE.STLLoader();
  ASM.forEach(cfg=>{
    const grp=ASM_GROUPS[cfg.grp]; if(!grp) return;
    loader.load('models/'+cfg.code+'.stl', geo=>{
      geo.computeBoundingBox();
      const c=geo.boundingBox.getCenter(new THREE.Vector3());
      geo.translate(-c.x,-c.y,-c.z);                 // origine = centre de la piece
      const m=new THREE.Mesh(geo, matPart);
      m.scale.setScalar(ASM_SCALE * (cfg.s||1));
      m.rotation.set(deg(cfg.r[0]), deg(cfg.r[1]), deg(cfg.r[2]));
      m.position.set(cfg.p[0], cfg.p[1], cfg.p[2]);
      m.userData.partId = cfg.id;
      m.userData.asm = true;
      m.userData.code = cfg.code;
      m.userData.off = !!cfg.off;
      grp.add(m);
      asmMeshes.push(m);
      m.visible = asmVisible(m);
    }, undefined, ()=>{ /* piece absente: on ignore */ });
  });
}
function setAssembly(on){
  assemblyOn=on;
  if(on) buildAssembly();
  // Longueurs de segments : calées sur les VRAIES pièces en vue assemblée
  // (sinon les pièces débordent d'un segment sur l'autre et ça fait un tas).
  elbowG.position.y = on ? LINK_REAL.elbow : L1;
  wristG.position.y = on ? LINK_REAL.wrist : L2;
  headG.position.y  = on ? LINK_REAL.head  : 0.86;
  root.traverse(o=>{
    if(!o.isMesh) return;
    if(o.userData.partId==='eye') return;          // l'oeil reste (l'ame)
    if(o.userData.asm) o.visible = asmVisible(o);  // vraies pieces
    else o.visible = !on;                          // pieces stylisees
  });
}
async function toggleAssembly(btn){
  if(btn) btn.disabled = true;
  await setURDF(!urdfOn);
  if(btn) btn.disabled = false;
  assemblyOn = urdfOn;
  if(btn){ btn.classList.toggle('active', assemblyOn);
    btn.innerHTML = assemblyOn ? '<span class="ic">🧊</span>Vue stylisée' : '<span class="ic">🦾</span>Vrai Moveo'; }
  // Le bras réel est plus grand (vraies longueurs de segments) : on recule la
  // caméra et on vise plus haut pour le cadrer entier au-dessus du HUD.
  camTween = null;
  if(assemblyOn){ orbit.theta=0.6; orbit.phi=1.18; orbit.r=22; orbit.target.set(0,3.0,0); }
  else { orbit.theta=CAM_HOME.theta; orbit.phi=CAM_HOME.phi; orbit.r=CAM_HOME.r; orbit.target.copy(CAM_HOME.target); }
  log('etat', assemblyOn ? 'corps: vrai Moveo (URDF)' : 'corps: Moveo modélisé');
}

/* ---------- Le VRAI Moveo, via son URDF ----------
   Un URDF est la description standard d'un robot : chaque <link> porte son
   mesh, chaque <joint> porte l'assemblage (origine xyz + rpy) et la
   cinématique (axe, limites). C'est exactement la donnée qui manque aux STL
   bruts, posés à plat pour l'impression. Source : jesseweisberg/moveo_ros (MIT). */
const URDF_URL = 'urdf/moveo.urdf';
// Quelle articulation du robot réel suit quel axe de notre squelette
const URDF_DRIVE = { Joint_1:'yaw', Joint_2:'shoulder', Joint_3:'elbow',
                     Joint_4:'wristRoll', Joint_5:'wristPitch' };
// Quel link correspond à quelle pièce du catalogue (clic -> fiche)
const URDF_PART = { base_link:'base', Link_1:'yaw', Link_2:'upper', Link_3:'elbow',
                    Link_4:'forearm', Link_5:'wrist',
                    Gripper_Servo_Gear:'head', Gripper_Idol_Gear:'head',
                    Tip_Gripper_Servo:'head',  Tip_Gripper_Idol:'head',
                    Pivot_Arm_Gripper_Servo:'head', Pivot_Arm_Gripper_Idol:'head' };
let urdfRoot=null, urdfJoints={}, urdfLinks={}, urdfOn=false, urdfLoading=false;
let urdfEyeHost=null;
// Positions de l'oeil dans le repère du bras stylisé. En mode URDF le repère du
// poignet réel est tout autre (origine et orientation), d'où la sauvegarde.
let eyeHome=null;
// Haute définition = les vrais meshes (1 M de triangles, ~19 Mo compressés).
// Allégé = les meshes de collision (6,6 Mo), utile si le téléphone rame.
let urdfHiRes = true;

// URDF : rpy est une rotation d'axes FIXES Rz(yaw)·Ry(pitch)·Rx(roll).
// Dans three.js c'est l'ordre 'ZYX' (sinon l'assemblage part de travers).
function rpyToEuler(rpy){ return new THREE.Euler(rpy[0], rpy[1], rpy[2], 'ZYX'); }
function numList(str, fallback){
  if(!str) return fallback.slice();
  const v = str.trim().split(/\s+/).map(Number);
  return v.length===3 && v.every(n=>isFinite(n)) ? v : fallback.slice();
}

async function loadURDF(){
  if(urdfRoot || urdfLoading || !window.THREE || !THREE.STLLoader) return urdfRoot;
  urdfLoading = true;
  let doc;
  try{
    const xml = await (await fetch(URDF_URL, {cache:'force-cache'})).text();
    doc = new DOMParser().parseFromString(xml, 'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('URDF illisible');
  }catch(e){ urdfLoading=false; log('etat','URDF introuvable'); return null; }

  // 1) un groupe par link, avec son mesh
  const loader = new THREE.STLLoader();
  const matU = new THREE.MeshStandardMaterial({color:0xd7dde6, metalness:0.45, roughness:0.45, envMapIntensity:1.1});
  const pending = [];
  doc.querySelectorAll('robot > link').forEach(l=>{
    const name = l.getAttribute('name');
    const g = new THREE.Group(); g.name = name;
    urdfLinks[name] = g;
    const mesh = l.querySelector('visual > geometry > mesh');
    if(!mesh || name === 'base_link') return;   // la planche de montage : notre socle fait déjà le travail
    let file = mesh.getAttribute('filename');
    // _clean = mesh détaillé dont on a retiré la visserie modélisée en corps
    // libres : dans l'export CAO, chaque link porte ses vis, qui traversent la
    // pièce voisine et se retrouvent donc à flotter dans le vide.
    if(urdfHiRes) file = file.replace('_col.STL', '_clean.STL');
    const vo = l.querySelector('visual > origin');
    const xyz = numList(vo && vo.getAttribute('xyz'), [0,0,0]);
    const rpy = numList(vo && vo.getAttribute('rpy'), [0,0,0]);
    pending.push(new Promise(res=>{
      loader.load('urdf/'+file, geo=>{
        const m = new THREE.Mesh(geo, matU);
        m.position.set(xyz[0],xyz[1],xyz[2]);
        m.setRotationFromEuler(rpyToEuler(rpy));
        if(URDF_PART[name]){
          m.userData.partId = URDF_PART[name];
          // partMeshes est bâti au démarrage : les pièces URDF arrivent après,
          // il faut donc les y inscrire à la main sinon elles ne s'allument pas.
          (partMeshes[m.userData.partId] || (partMeshes[m.userData.partId]=[])).push(m);
        }
        m.userData.mat0 = matU;
        m.userData.urdf = true;
        g.add(m); res();
      }, undefined, ()=>res());
    }));
  });

  // 2) les joints assemblent l'arbre : origine figée, puis rotation sur l'axe
  doc.querySelectorAll('robot > joint').forEach(j=>{
    const parent = urdfLinks[j.querySelector('parent').getAttribute('link')];
    const child  = urdfLinks[j.querySelector('child').getAttribute('link')];
    if(!parent || !child) return;
    const o = j.querySelector('origin');
    const xyz = numList(o && o.getAttribute('xyz'), [0,0,0]);
    const rpy = numList(o && o.getAttribute('rpy'), [0,0,0]);
    const fixed = new THREE.Group();                 // l'assemblage, immobile
    fixed.position.set(xyz[0],xyz[1],xyz[2]);
    fixed.setRotationFromEuler(rpyToEuler(rpy));
    const hinge = new THREE.Group();                 // la rotation de l'axe
    fixed.add(hinge); hinge.add(child); parent.add(fixed);
    const a = j.querySelector('axis');
    const ax = numList(a && a.getAttribute('xyz'), [0,0,1]);
    const lim = j.querySelector('limit');
    urdfJoints[j.getAttribute('name')] = {
      hinge, node: fixed,                      // repère figé du joint : ancrage des câbles
      axis: new THREE.Vector3(ax[0],ax[1],ax[2]).normalize(),
      lower: lim ? parseFloat(lim.getAttribute('lower')) : -Math.PI,
      upper: lim ? parseFloat(lim.getAttribute('upper')) :  Math.PI,
      type: j.getAttribute('type'),
    };
  });

  await Promise.all(pending);

  // Encombrement propre de chaque link (ses maillages seuls, pas ses enfants) :
  // c'est ce qui dit au câble à quelle distance passer pour longer la coque
  // au lieu de la traverser.
  for(const name in urdfLinks){
    // expandByObject travaille en monde : ici on veut le repère du link, donc
    // on compose à la main avec la matrice locale du maillage.
    const bb = new THREE.Box3();
    urdfLinks[name].children.forEach(c=>{
      if(!c.isMesh || !c.geometry) return;
      c.geometry.computeBoundingBox(); c.updateMatrix();
      bb.union(c.geometry.boundingBox.clone().applyMatrix4(c.matrix));
    });
    if(!bb.isEmpty()) urdfLinks[name].userData.bb = bb;
  }

  // 3) Z-up (convention robotique) -> Y-up (three.js), puis mise à l'échelle
  const base = urdfLinks['base_link'];
  if(!base){ urdfLoading=false; return null; }
  urdfRoot = new THREE.Group();
  const zup = new THREE.Group(); zup.rotation.x = -Math.PI/2;
  zup.add(base); urdfRoot.add(zup);
  urdfRoot.visible = false; root.add(urdfRoot);

  urdfEyeHost = new THREE.Group();                  // annule l'échelle du robot
  const l5 = urdfLinks['Link_5'];
  if(l5){
    l5.add(urdfEyeHost);
    // Direction moyenne des fixations de la pince : c'est là que "regarde" la main.
    const dir = new THREE.Vector3(); let cnt = 0;
    l5.children.forEach(c=>{ if(c !== urdfEyeHost && c.isObject3D && !c.isMesh){ dir.add(c.position); cnt++; } });
    if(cnt) dir.divideScalar(cnt); else dir.set(-1, 0, 0.5);
    const out = dir.clone().normalize();
    // On sort la caméra de la coque : sa position est en mètres (repère du poignet).
    urdfEyeHost.position.copy(out.clone().multiplyScalar(0.085));
    urdfEyeHost.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), out);
  }

  const box = new THREE.Box3().setFromObject(urdfRoot);
  const size = box.getSize(new THREE.Vector3());
  const s = size.y > 0.01 ? 8.2/size.y : 10;          // même gabarit que le bras stylisé
  urdfRoot.scale.setScalar(s);
  // Sans la planche de montage, le bras garde l'offset qu'elle portait :
  // on le recentre sur l'origine et on le pose au sol.
  const c = box.getCenter(new THREE.Vector3());
  urdfRoot.position.set(-c.x * s, -box.min.y * s, -c.z * s);
  urdfRoot.userData.yFloor = box.min.y;                // en mètres, repère du robot
  urdfEyeHost.scale.setScalar(1/s);                   // l'oeil garde sa taille
  urdfLoading = false;
  log('etat','vrai Moveo chargé ('+Object.keys(urdfJoints).length+' articulations)');
  return urdfRoot;
}

function disposeURDF(){
  if(!urdfRoot) return;
  urdfRoot.traverse(o=>{ if(o.isMesh && o.geometry) o.geometry.dispose(); });
  for(const k in partMeshes) partMeshes[k] = partMeshes[k].filter(m=>!m.userData.urdf);
  root.remove(urdfRoot);
  urdfRoot=null; urdfJoints={}; urdfLinks={}; urdfEyeHost=null; cableMesh=[];
}
async function setQuality(hi){
  if(hi === urdfHiRes) return;
  urdfHiRes = hi;
  const was = urdfOn;
  if(urdfRoot){ [eyePod, eye, glowSpr, eyeLight].forEach(x=>{ if(x) wristG.add(x); }); disposeURDF(); }
  log('etat', 'qualité: ' + (hi ? 'détaillée' : 'allégée'));
  if(was) await setURDF(true);
}

function setJoint(name, angle){
  const j = urdfJoints[name]; if(!j) return;
  if(j.type !== 'continuous') angle = Math.max(j.lower, Math.min(j.upper, angle));
  j.hinge.quaternion.setFromAxisAngle(j.axis, angle);
}

/* ---------- Câblage : la gaine moteur qui longe le bras ----------
   Le vrai Moveo tire les fils des NEMA depuis le socle jusqu'au poignet. Une
   géométrie figée ne peut pas suivre le bras : on relève la position réelle
   des articulations à chaque rafraîchissement et on retrace le tube.
   Ancrage sur le repère "fixed" de chaque joint : il ne tourne pas avec l'axe,
   donc le câble reste collé à la pièce porteuse au lieu de pivoter avec elle. */
// Deux torons : la grosse gaine des NEMA, et un fil de servo plus fin qui la
// double. Un seul tube faisait faux, deux suffisent à faire faisceau.
// `pad` = jeu laissé entre la coque de la pièce et l'axe du tube.
// hug < 1 : la boîte englobante surestime toujours une pièce tournée, on
// rattrape pour que la gaine lèche la coque au lieu de flotter à côté.
const CABLE = { seg:72, radial:7, every:0.07, hug:0.9 };
const CABLE_STRANDS = [
  { r:0.0070, pad:0.013, sag:0.013 },
  { r:0.0040, pad:0.004, sag:0.024 },
];
const CABLE_CHAIN = ['Joint_1','Joint_2','Joint_3','Joint_4','Joint_5'];
let cableMesh=[], cableAcc=0;

// Distance entre l'origine du link et sa surface, dans la direction `dirW`
// (monde). La boîte tourne avec la pièce : le câble reste dehors quel que
// soit l'angle de l'articulation.
function linkReach(link, dirW){
  const bb = link && link.userData.bb; if(!bb) return 0;
  const inv = new THREE.Matrix4().copy(link.matrixWorld).invert();
  const o = new THREE.Vector3().applyMatrix4(inv);
  const d = new THREE.Vector3().copy(dirW).applyMatrix4(inv).sub(o).normalize();
  const c = bb.getCenter(new THREE.Vector3()), h = bb.getSize(new THREE.Vector3()).multiplyScalar(0.5);
  return c.dot(d) + Math.abs(h.x*d.x) + Math.abs(h.y*d.y) + Math.abs(h.z*d.z);
}

// Les points sont rendus dans le repère du robot (mètres URDF), pas en monde :
// urdfRoot porte l'échelle, un tube enfant hérite donc du bon gabarit.
function cablePath(sp){
  if(!urdfRoot) return null;
  const j2 = urdfJoints['Joint_2']; if(!j2) return null;
  urdfRoot.updateWorldMatrix(true, true);
  const inv = new THREE.Matrix4().copy(urdfRoot.matrixWorld).invert();
  const toLocal = w => w.clone().applyMatrix4(inv);
  // conversion d'une direction : deux points, puis différence (l'échelle saute)
  const ref = new THREE.Vector3(); urdfRoot.getWorldPosition(ref);
  const dirLocal = d => toLocal(ref.clone().add(d)).sub(toLocal(ref)).normalize();

  // Le côté du bras = axe de l'épaule. Perpendiculaire au plan de travail,
  // il tourne avec la base : la gaine reste toujours sur la même joue.
  const q = new THREE.Quaternion(); j2.node.getWorldQuaternion(q);
  const sideW = j2.axis.clone().applyQuaternion(q).normalize();
  const side = dirLocal(sideW);
  const down = dirLocal(new THREE.Vector3(0,-1,0));

  const anchors = []; let reach0 = 0;
  CABLE_CHAIN.forEach((name, k)=>{
    const j = urdfJoints[name]; if(!j) return;
    // L'origine du joint est commune à la charnière et au link mené : on prend
    // l'encombrement du link mené, celui que le câble va longer ensuite.
    const child = j.hinge.children[0];
    const reach = Math.max(0.02, linkReach(child, sideW)*CABLE.hug) + sp.pad;
    if(!k) reach0 = reach;
    const w = new THREE.Vector3(); j.node.getWorldPosition(w);
    anchors.push(toLocal(w).addScaledVector(side, reach));
  });
  const l5 = urdfLinks['Link_5'];
  if(l5){
    const w = new THREE.Vector3(); l5.getWorldPosition(w);
    anchors.push(toLocal(w).addScaledVector(side, Math.max(0.02, linkReach(l5, sideW)*CABLE.hug)*0.6 + sp.pad));
  }
  if(anchors.length < 2) return null;

  // Sortie de socle : la gaine plonge le long du fût jusqu'au plateau au lieu
  // de finir en l'air, et reste dehors (reach0 = demi-largeur de la tourelle).
  const yF = urdfRoot.userData.yFloor;
  const drop = typeof yF === 'number' ? Math.max(0.03, anchors[0].y - yF - 0.004) : 0.1;
  const foot = anchors[0].clone().addScaledVector(down, drop).addScaledVector(side, reach0*0.25);
  const pts = [foot, anchors[0].clone().addScaledVector(down, drop*0.5).addScaledVector(side, reach0*0.12)];

  // Boucle de service entre deux ancrages : un peu de mou, un peu vers l'extérieur.
  for(let i=0;i<anchors.length;i++){
    pts.push(anchors[i]);
    if(i === anchors.length-1) break;
    const len = anchors[i].distanceTo(anchors[i+1]);
    if(len < 0.02) continue;
    pts.push(anchors[i].clone().lerp(anchors[i+1], 0.5)
      .addScaledVector(down, sp.sag * Math.min(1, len/0.16))
      .addScaledVector(side, sp.sag*0.5));
  }
  return pts;
}

function updateCables(){
  CABLE_STRANDS.forEach((sp, i)=>{
    const pts = cablePath(sp); if(!pts) return;
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
    const geo = new THREE.TubeGeometry(curve, CABLE.seg, sp.r, CABLE.radial, false);
    if(cableMesh[i]){ cableMesh[i].geometry.dispose(); cableMesh[i].geometry = geo; return; }
    const m = new THREE.Mesh(geo, matHose);
    m.userData.urdf = true;       // exempté du basculement stylisé/réel
    m.userData.mat0 = matHose;    // pour que l'isolement sache quoi rendre
    m.castShadow = true;
    cableMesh[i] = m; urdfRoot.add(m);
  });
}

async function setURDF(on){
  urdfOn = on;
  if(on) await loadURDF();
  if(urdfRoot) urdfRoot.visible = on;
  root.traverse(o=>{
    if(!o.isMesh || o.userData.urdf) return;
    if(o.userData.partId==='eye') return;          // l'oeil reste (l'ame)
    if(o.userData.asm) o.visible = false;
    else o.visible = !on;
  });
  // l'oeil suit le poignet du vrai robot
  if(!eyeHome){                                   // mémorise la pose d'origine
    eyeHome = [eyePod, eye, glowSpr, eyeLight].map(x=>({
      o:x, p:x.position.clone(), q:x.quaternion.clone() }));
  }
  const host = on ? (urdfEyeHost || wristG) : wristG;
  if(host){ [eyePod, eye, glowSpr, eyeLight].forEach(x=>{ if(x) host.add(x); }); }
  if(on && urdfEyeHost){
    // Dans l'hôte, +Z pointe hors de la coque : on aligne la caméra dessus.
    eyePod.position.set(0,0,0);     eyePod.rotation.set(0,0,0);
    eye.position.set(0,0,0.10);
    glowSpr.position.set(0,0,0.12);
    eyeLight.position.set(0,0,0.16);
  } else if(!on && eyeHome){
    eyeHome.forEach(h=>{ h.o.position.copy(h.p); h.o.quaternion.copy(h.q); });
  }
  if(!on && urdfRoot) urdfRoot.visible = false;
}

/* ---------- FX JARVIS : survol, focus caméra, anneau de scan ---------- */
const partMeshes = {};
root.traverse(o=>{ if(o.isMesh && o.userData.partId){ o.userData.mat0 = o.material; (partMeshes[o.userData.partId] || (partMeshes[o.userData.partId]=[])).push(o); } });
const hoverMat = new THREE.MeshStandardMaterial({color:0x0e2a33, emissive:0x34d3ee, emissiveIntensity:0.5, metalness:0.5, roughness:0.3});
const focusMat = new THREE.MeshStandardMaterial({color:0x0e2a33, emissive:0x34d3ee, emissiveIntensity:0.9, metalness:0.4, roughness:0.25});
let hoverPart=null, focusPart=null, camTween=null, scanRings=[];
/* Mode inspection : le bras s'arrête et tout s'efface sauf la pièce regardée. */
let frozen=false, autoFroze=false;
const dimMat = new THREE.MeshStandardMaterial({color:0x33404f, metalness:0.1, roughness:0.9,
  transparent:true, opacity:0.16, depthWrite:false});
function setIsolation(on, keepId){
  root.traverse(o=>{
    if(!o.isMesh || o.userData.partId==='eye') return;
    const mine = keepId && o.userData.partId===keepId;
    o.material = (on && !mine) ? dimMat : (o.userData.mat0 || o.material);
  });
  if(on && keepId) applyMat(keepId, focusMat);
}
function setFrozen(on, auto){
  frozen = on; autoFroze = !!auto && on;
  const b = document.getElementById('freezeBtn');
  if(b){ b.classList.toggle('active', frozen);
    b.innerHTML = frozen ? '<span class="ic">▶</span>Animer' : '<span class="ic">❄</span>Figer'; }
  if(!auto) log('etat', frozen ? 'bras figé pour inspection' : 'bras réanimé');
}
const CAM_HOME = {theta:0.7, phi:1.06, r:15.5, target:new THREE.Vector3(0,3.4,0)};
const lerp=(a,b,t)=>a+(b-a)*t;

function meshesOf(id){ return partMeshes[id]||[]; }
function applyMat(id, mat){ meshesOf(id).forEach(m=>{ m.material = mat || m.userData.mat0; }); }
function setHover(id){
  if(focusPart) return;                  // en inspection, le survol ne perturbe pas
  if(id===hoverPart) return;
  if(hoverPart && hoverPart!==focusPart) applyMat(hoverPart, null);
  hoverPart=id;
  if(id && id!==focusPart) applyMat(id, hoverMat);
  if(id) sfx('hover');
}
function setFocus(id){
  if(focusPart && focusPart!==id) applyMat(focusPart, null);
  focusPart=id;
  if(id) applyMat(id, focusMat);
  else if(hoverPart) applyMat(hoverPart, hoverMat);
}
/* Un mesh peut être visible alors qu'un de ses parents est masqué : il faut
   remonter la chaîne, sinon on vise et on clique des pièces invisibles. */
function isShown(o){ let n=o; while(n){ if(n.visible===false) return false; n=n.parent; } return true; }

/* Centre RÉEL de la pièce : la moyenne des origines des meshes visait le point
   d'articulation du link, souvent loin de la forme visible. On prend le centre
   de la boîte englobante. */
function partCenter(id){
  const ms=meshesOf(id).filter(isShown); if(!ms.length) return null;
  const box=new THREE.Box3(); ms.forEach(m=>box.expandByObject(m));
  return box.isEmpty() ? null : box.getCenter(new THREE.Vector3());
}
function pickHit(x,y){
  const ndc=new THREE.Vector2((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  // three.js lance le rayon même sur les objets masqués : on filtre nous-mêmes,
  // sinon le bras stylisé caché intercepte les clics destinés au vrai Moveo.
  const ms=[]; root.traverse(o=>{ if(o.isMesh && o.userData.partId && isShown(o)) ms.push(o); });
  const h=raycaster.intersectObjects(ms,false)[0];
  return h ? {id:h.object.userData.partId, point:h.point.clone()} : null;
}
function focusOn(worldPos, dist){
  camTween={ t:0, dur:0.9,
    from:{theta:orbit.theta, phi:orbit.phi, r:orbit.r, target:orbit.target.clone()},
    to:{theta:orbit.theta, phi:1.0, r:(dist||4.6), target:worldPos.clone()} };
}
function resetView(){
  camTween={ t:0, dur:0.9,
    from:{theta:orbit.theta, phi:orbit.phi, r:orbit.r, target:orbit.target.clone()},
    to:{theta:CAM_HOME.theta, phi:CAM_HOME.phi, r:CAM_HOME.r, target:CAM_HOME.target.clone()} };
}
function scanRing(pos){
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.16,0.22,48),
    new THREE.MeshBasicMaterial({color:0x34d3ee, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending}));
  ring.position.copy(pos); scene.add(ring); scanRings.push({ring,t:0});
}
function updateFx(dt){
  if(camTween){ camTween.t+=dt; const p=Math.min(1,camTween.t/camTween.dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    orbit.theta=lerp(camTween.from.theta,camTween.to.theta,e);
    orbit.phi=lerp(camTween.from.phi,camTween.to.phi,e);
    orbit.r=lerp(camTween.from.r,camTween.to.r,e);
    orbit.target.lerpVectors(camTween.from.target,camTween.to.target,e);
    if(p>=1) camTween=null;
  } else {
    lockTarget(dt);            // hors transition, la cible reste collée au bras
  }
  if(focusPart) focusMat.emissiveIntensity = 0.7 + 0.45*Math.max(0,Math.sin(clock*3.5));
  if(scanRings.length) scanRings=scanRings.filter(s=>{
    s.t+=dt; const p=s.t/0.75; s.ring.quaternion.copy(camera.quaternion);
    const sc=0.2+p*2.8; s.ring.scale.set(sc,sc,1); s.ring.material.opacity=0.85*(1-p);
    if(p>=1){ scene.remove(s.ring); s.ring.geometry.dispose(); s.ring.material.dispose(); return false; }
    return true;
  });
}

const GESTURES = {
  yes:     {dur:1.5, fn:(p,o)=>{ o.wristPitch += Math.sin(p*Math.PI*3)*0.55*Math.sin(p*Math.PI); }},
  no:      {dur:1.4, fn:(p,o)=>{ o.wristYaw   += Math.sin(p*Math.PI*3)*0.62*Math.sin(p*Math.PI); }},
  tilt:    {dur:1.9, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.wristRoll += 0.5*e; o.wristPitch += 0.14*e; }},
  greet:   {dur:1.9, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.shoulder += -0.28*e; o.wristPitch += Math.sin(p*Math.PI*4)*0.42*e; }},
  happy:   {dur:1.7, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.wristRoll += Math.sin(p*Math.PI*6)*0.36*e; o.headBob += Math.sin(p*Math.PI*8)*0.13*e; o.shoulder += -0.1*e; }},
  confused:{dur:2.0, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.wristRoll += 0.42*e; o.wristYaw += Math.sin(p*Math.PI*2)*0.22*e; o.shoulder += -0.12*e; }},
  stretch: {dur:2.6, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.shoulder += -0.42*e; o.wristPitch += 0.4*e; o.elbow += -0.3*e; }},
  startle: {dur:0.9, fn:(p,o)=>{ const e=Math.sin(p*Math.PI); o.shoulder += -0.32*e; o.wristPitch += -0.3*e; }}
};
let activeGestures = [];

/* ---------- Voix ----------
   SA VOIX : speechSynthesis, rendue par les voix installées sur ta machine
   (SAPI sous Windows). Rien ne sort du PC.

   TA VOIX : l'API de reconnaissance du navigateur. Attention, sur Chromium
   l'audio part chez l'éditeur pour être transcrit : c'est le seul morceau
   d'ARIA qui n'est pas local. D'où un bouton, et jamais d'écoute permanente.
   Le jour où on branche Whisper sur le serveur, ce bout devient local aussi. */
const VOICE = { on:false, voice:null, rate:1.05, pitch:1.15 };

function pickVoice(){
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || []; }catch(e){ return; }
  VOICE.voice = vs.find(v=>/^fr[-_]FR/i.test(v.lang))
             || vs.find(v=>/^fr/i.test(v.lang)) || null;
}
if(window.speechSynthesis){
  pickVoice();
  // Sur Chromium la liste des voix arrive après coup : sans ça, on tomberait
  // sur la voix anglaise par défaut.
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}

function speak(text){
  if(!VOICE.on || !text || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();          // elle ne se coupe pas la parole
    const u = new SpeechSynthesisUtterance(text);
    if(VOICE.voice) u.voice = VOICE.voice;
    u.lang = 'fr-FR'; u.rate = VOICE.rate; u.pitch = VOICE.pitch;
    speechSynthesis.speak(u);
  }catch(e){}
}

const voiceBtn = document.getElementById('voiceBtn');
if(voiceBtn){
  if(!window.speechSynthesis){
    voiceBtn.disabled = true; voiceBtn.title = "Ce navigateur ne sait pas parler";
  }
  voiceBtn.addEventListener('click', ()=>{
    VOICE.on = !VOICE.on;
    voiceBtn.classList.toggle('active', VOICE.on);
    if(!VOICE.on){ try{ speechSynthesis.cancel(); }catch(e){} }
    log('etat', VOICE.on ? 'voix activée'+(VOICE.voice?' ('+VOICE.voice.name+')':'') : 'voix coupée');
    if(VOICE.on) speak('Je suis là.');
  });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const micBtn = document.getElementById('micBtn');

function setMic(on){
  listening = on;
  if(!micBtn) return;
  micBtn.classList.toggle('active', on);
  micBtn.innerHTML = on ? '<span class="ic">⏹</span>J\'écoute'
                        : '<span class="ic">🎙</span>Micro';
}

function toggleMic(){
  if(!SR){ log('etat', "ce navigateur ne sait pas écouter, essaie Chrome ou Edge"); return; }
  if(listening){ try{ rec.stop(); }catch(e){} return; }
  rec = new SR();
  rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onresult = ev=>{
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    // On écrit dans le champ au fil de l'eau : tu vois ce qu'elle comprend.
    sayIn.value = (finalText + interim).trim();
  };
  rec.onerror = ev=>{
    setMic(false);
    const why = ev.error === 'not-allowed' ? 'autorisation micro refusée'
              : ev.error === 'no-speech'   ? 'rien entendu'
              : ev.error;
    log('etat', 'micro : ' + why);
  };
  rec.onend = ()=>{
    setMic(false);
    if(finalText.trim()){ sayIn.value = finalText.trim(); send(); }
  };
  try{ rec.start(); setMic(true); log('etat', 'micro ouvert, parle-lui'); }
  catch(e){ setMic(false); log('etat', 'micro indisponible'); }
}
if(micBtn) micBtn.addEventListener('click', toggleMic);

/* Pensée affichée (petit effet machine à écrire) */

function think(text){
  speak(text);                       // la voix part tout de suite, sans attendre
  if(thoughtTimer) clearInterval(thoughtTimer);

  thoughtTimer = setInterval(()=>{
    i++; thoughtEl.innerHTML = text.slice(0,i).replace(/</g,'&lt;') + '<span class="cursor"></span>';
    if(i>=text.length){ clearInterval(thoughtTimer); thoughtTimer=null; }
  }, 24);

function setState(s){
  if(brain.state===s) return;
  brain.state = s;
  document.getElementById('stateLabel').textContent = STATE_FR[s];
  const col = EYE_COLORS[s];
  document.getElementById('stateDot').style.color = '#'+new THREE.Color(col).getHexString();
  document.getElementById('moodLabel').textContent = STATE_FR[s];
  document.getElementById('moodLabel').style.color = brain.awake ? '#'+new THREE.Color(col).getHexString() : 'var(--dim)';
}

function react(kind){ // transitions courtes déclenchées par le dialogue/actions
  brain.lastInteract = clock; brain.boredom = Math.max(0, brain.boredom-0.5);
  if(kind==='yes'){ setState('happy'); trigger('yes'); }
  else if(kind==='no'){ setState('confused'); trigger('no'); }
  else if(kind==='greet'){ setState('happy'); brain.energy=Math.min(1,brain.energy+0.1); trigger('greet'); }
  else if(kind==='happy'){ setState('happy'); brain.energy=Math.min(1,brain.energy+0.12); trigger('happy'); }
  else if(kind==='curious'){ setState('curious'); brain.curiosity=Math.min(1,brain.curiosity+0.2); trigger('tilt'); }
  setTimeout(()=>{ if(brain.awake && brain.state!=='sleep') setState('attentive'); }, 1900);
}

/* ---------- Couche DIALOGUE (en couches) ----------
   Routeur : la couche IA (Claude) interprète et décide quand elle est
   disponible ; sinon on retombe sur les réflexes scriptés. C'est l'ancien
   SEAM, désormais branché. */
function interpret(raw){
  if(!raw.trim()) return;
  if(server.connected){ serverSend({type:'say', text:raw}); return; }  // le serveur décide
  log('dialogue', '« '+raw+' »');
  if(!brain.awake) wake(true);
  if(brain.ai) aiRespond(raw);
  else interpretScripted(raw);
}

/* Repli scripté (règles) : le socle nerveux quand l'IA est absente ou refusée */
function interpretScripted(raw){
  const t = raw.toLowerCase().trim();
  if(!t) return;
  if(/(bonjour|salut|coucou|hey|hello|bonsoir)/.test(t)){
    react('greet'); think('Bonjour ! Content de te voir.'); return;
  }
  if(/(bravo|super|g[ée]nial|bien jou[ée]|merci|gentil|parfait)/.test(t)){
    react('happy'); think('Merci ! Ça me fait plaisir.'); return;
  }
  if(/(danse|bouge|remue|amuse)/.test(t)){
    react('happy'); think('Regarde ça !'); return;
  }
  if(/(dors|dodo|repos|veille|pause)/.test(t)){
    sleep(); return;
  }
  if(/(r[ée]veille|debout|l[eè]ve|wake)/.test(t)){
    wake(true); think('Je suis réveillé.'); return;
  }
  if(t.includes('?')){
    // question fermée -> il répond par hochement, avec une "humeur"
    const yes = Math.random() < (0.45 + brain.energy*0.25);
    if(yes){ react('yes'); think('Oui.'); log('decision','question -> réponse OUI'); }
    else   { react('no');  think('Non.'); log('decision','question -> réponse NON'); }
    return;
  }
  // Défaut (mode réflexe) : pas de compréhension fine sans la couche IA
  react('curious');
  think('En réflexes seuls, je ne saisis pas tout.');
  log('decision','énoncé non reconnu (mode réflexe)');
}

/* ---------- Couche IA (LLM via claude.use('sample')) ----------
   ARIA interroge Claude sur le compte du visiteur. Aucune clé, aucun
   serveur. On demande une DÉCISION structurée (état + geste + phrase),
   pas un long texte : le corps reste le moyen d'expression principal. */
const AI_PERSONA =
  "Tu es ARIA, un petit bras robotisé d'atelier : curieux, joueur et attachant, "+
  "dans l'esprit d'un bras assistant de génie (façon 'Dummy'). Tu ne discutes pas "+
  "longuement, tu t'exprimes surtout par gestes et hochements de tête. Tu réponds "+
  "toujours en français, sans tiret cadratin.";

function buildAIPrompt(raw){
  const s = "État interne : éveil="+(brain.awake?'oui':'non')+
    ", énergie="+brain.energy.toFixed(2)+", curiosité="+brain.curiosity.toFixed(2)+
    ", ennui="+brain.boredom.toFixed(2)+", humeur="+brain.state+".";
  return AI_PERSONA+"\n\n"+s+
    "\n\nL'humain te dit : \""+raw.replace(/"/g,"'")+"\"\n\n"+
    "Décide de ta réaction. Réponds UNIQUEMENT par un objet JSON, rien d'autre :\n"+
    '{"state":"...","gesture":"...","say":"...","sleep":false}\n'+
    "- state parmi : idle, attentive, curious, happy, confused\n"+
    "- gesture parmi : yes, no, tilt, greet, happy, confused, stretch, none\n"+
    "  (yes = hoche « oui », no = hoche « non », tilt = penche la tête, greet = salue)\n"+
    "- say : courte phrase (max 12 mots) de ce qu'ARIA pense/dit\n"+
    "- sleep : true seulement s'il te demande de te reposer/dormir\n"+
    "Pour une question fermée, choisis yes ou no selon ton humeur et réponds brièvement.";
}

async function aiRespond(raw){
  const ai = brain.ai; if(!ai) return interpretScripted(raw);
  showThinking(); setState('attentive');
  try{
    const d = await ai.json(buildAIPrompt(raw), {modelTier:'quick', cache:false});
    applyAI(d);
  }catch(e){
    const code = e && e.code;
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){
      brain.ai=null; setAIStatus(false);
      log('etat','couche IA indisponible -> repli réflexes'); interpretScripted(raw);
    } else if(code==='rate_limited'){
      setState('confused'); think("Trop de questions d'un coup, laisse-moi souffler.");
      log('decision','IA saturée (rate limit)');
    } else if(code==='refused'){
      setState('confused'); think("Je préfère ne pas répondre à ça.");
      log('decision','IA a décliné');
    } else {
      log('decision','IA en erreur ('+(code||'?')+') -> repli réflexes'); interpretScripted(raw);
    }
  }
}

function applyAI(d){
  if(!d || typeof d!=='object'){ interpretScripted(''); return; }
  brain.lastInteract=clock; brain.boredom=Math.max(0, brain.boredom-0.5);
  const say = typeof d.say==='string' ? d.say : '';
  if(d.sleep===true){ if(say) think(say); log('dialogue','IA -> repos'); setTimeout(()=>sleep(), 700); return; }
  const st = ['idle','attentive','curious','happy','confused'].includes(d.state) ? d.state : 'attentive';
  setState(st);
  const g = d.gesture;
  if(typeof g==='string' && GESTURES[g]) trigger(g);
  if(say) think(say);
  if(g==='happy'||g==='greet') brain.energy=Math.min(1, brain.energy+0.08);
  log('dialogue','IA -> '+st+(GESTURES[g]?' + '+g:''));
  setTimeout(()=>{ if(brain.awake && brain.state===st) setState('attentive'); }, 2200);
}

function showThinking(){
  if(thoughtTimer){ clearInterval(thoughtTimer); thoughtTimer=null; }
  thoughtEl.innerHTML = '<span style="color:var(--muted)">réfléchit</span><span class="cursor"></span>';
}
function updateChip(){

/* ---------- Couche CERVEAU SERVEUR (WebSocket) ----------
   Quand la page est servie par le cerveau Python (Railway), elle se connecte
   à /ws (même origine) et se laisse piloter : le serveur décide, le corps
   exécute. Dans l'artifact (bloqué par la CSP) ou depuis un fichier local,
   cette couche reste silencieuse et le cerveau local prend le relais. */
function onServerEvent(d){
  if(!d || typeof d!=='object') return;
  if(d.type==='state'){ if(typeof d.awake==='boolean') brain.awake=d.awake; if(d.state) setState(d.state); }
  else if(d.type==='gesture'){ if(GESTURES[d.name]) trigger(d.name); }
  else if(d.type==='thought'){ if(typeof d.text==='string') think(d.text); }
  else if(d.type==='attention'){ brain.attention.x=+d.x||0; brain.attention.y=+d.y||0; }
  else if(d.type==='log'){ log(d.layer||'etat', d.msg||''); }
}
function serverSend(obj){ if(server.connected){ try{ server.ws.send(JSON.stringify(obj)); }catch(_){} } }
function sendAttention(){
  if(!server.connected || (clock - server.lastAtt) < 0.1) return;   // throttle ~10/s
  server.lastAtt = clock;
  serverSend({type:'attention', x:brain.attention.x, y:brain.attention.y});
}
function connectServer(){
  if(location.protocol==='file:') return;
  let url, ws;
  try{ url = (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws'; }catch(e){ return; }
  try{ ws = new WebSocket(url); }catch(e){ return; }
  server.ws = ws;
  ws.onopen  = ()=>{ server.connected=true; server.tries=0; updateChip(); log('etat','cerveau serveur connecté'); };
  ws.onmessage = e=>{ try{ onServerEvent(JSON.parse(e.data)); }catch(_){} };
  ws.onerror = ()=>{ try{ ws.close(); }catch(_){} };
  ws.onclose = ()=>{
    const was = server.connected; server.connected=false; updateChip();
    if(was) log('etat','cerveau serveur déconnecté');
    server.tries++;
    if(was || server.tries < 6) setTimeout(connectServer, 1500); // sinon on laisse le cerveau local
  };
}
