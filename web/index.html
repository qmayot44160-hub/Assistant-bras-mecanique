/* Couche délibérative : décisions spontanées (stub règle-based, seam LLM) */
function decide(){
  if(server.connected) return;                 // le cerveau serveur pilote les décisions
  if(!brain.autonomy || !brain.awake) return;
  brain.nextDecision = 3 + Math.random()*4;

  if(brain.energy < 0.16){ log('decision','énergie basse -> mise en veille'); sleep(); return; }

  if(brain.boredom > 0.8){
    brain.boredom = 0.2;
    setState('curious'); trigger('tilt');
    think('Tu es toujours là ?');
    log('decision','ennui élevé -> cherche l\'attention');
    setTimeout(()=>{ if(brain.awake) setState('idle'); }, 2000);
    return;
  }
  // micro-comportements d'oisiveté
  const roll = Math.random();
  if(roll < 0.4){
    brain.attention.x = (Math.random()*2-1)*0.9;
    brain.attention.y = (Math.random()*2-1)*0.6;
    setState('idle');
    log('reflexe','balaye l\'atelier du regard');
  } else if(roll < 0.62){
    trigger('stretch'); setState('idle'); log('reflexe','s\'étire');
  } else if(roll < 0.78){
    trigger('tilt'); setState('curious');
    think('Hmm.'); log('decision','observe quelque chose');
    setTimeout(()=>{ if(brain.awake) setState('idle'); }, 1600);
  } else {
    setState('idle');
  }
}

/* ---------- Boucle ---------- */
const pose = { yaw:0, shoulder:-0.45, elbow:1.15, wristX:-0.3, wristY:0, wristZ:0 };
const cur  = Object.assign({}, pose);
let clock = 0, last = performance.now();

function targetPose(){
  if(brain.awake){
    const a = brain.attention;
    // Éveillé : posture redressée, proche de la station debout du vrai bras.
    return { yaw:a.x*0.85, shoulder:-0.22 - a.y*0.3, elbow:0.55,
             wristX:-0.2 + a.y*0.5, wristY:a.x*0.28, wristZ:0 };
  }
  // En veille : le bras se replie sur lui-même.
  return { yaw:cur.yaw*0.95, shoulder:0.45, elbow:1.5, wristX:0.7, wristY:0, wristZ:0.16 };
}

function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; clock += dt;

  // Couches temporelles
  brain.energy = Math.max(0, brain.energy - dt*0.006);
  if(brain.awake){
    brain.boredom = Math.min(1, brain.boredom + dt*0.03);
    brain.curiosity = Math.max(0.15, brain.curiosity - dt*0.02);
  }
  brain.nextDecision -= dt;
  if(brain.nextDecision <= 0) decide();

  // Pose cible -> easing
  const tp = targetPose();
  const k = 1 - Math.pow(0.0025, dt); // easing exp indépendant du framerate
  for(const key in pose){ cur[key] += (tp[key]-cur[key]) * k; }

  // Gestes (offsets)
  const off = {yaw:0, shoulder:0, elbow:0, wristPitch:0, wristYaw:0, wristRoll:0, headBob:0};
  activeGestures = activeGestures.filter(g=>{
    g.t += dt; const p = g.t/g.d.dur; if(p>=1) return false; g.d.fn(p, off); return true;
  });

  // Respiration
  const breathe = REDUCED ? 0 : Math.sin(clock*1.4)*0.02 * (brain.awake?1:0.3);

  // Application, bornée aux vraies amplitudes du bras (guide TomKnox / Moveo)
  const cl=(v,a,b)=>v<a?a:(v>b?b:v);
  if(!frozen){
  yawG.rotation.y      = cl(cur.yaw + off.yaw, JLIM.base[0], JLIM.base[1]);
  shoulderG.rotation.x = cl(cur.shoulder + off.shoulder + breathe, JLIM.shoulder[0], JLIM.shoulder[1]);
  elbowG.rotation.x    = cl(cur.elbow + off.elbow - breathe*0.5, JLIM.elbow[0], JLIM.elbow[1]);
  wristG.rotation.x    = cl(cur.wristX + off.wristPitch + off.headBob, JLIM.wrist1[0], JLIM.wrist1[1]);
  wristG.rotation.y    = cl(cur.wristY + off.wristYaw, JLIM.wrist2[0], JLIM.wrist2[1]);
  wristG.rotation.z    = cl(cur.wristZ + off.wristRoll, JLIM.wrist2[0], JLIM.wrist2[1]);

  // Le vrai Moveo suit la même pose que le squelette (angles déjà bornés)
  if(urdfOn){
    setJoint('Joint_1', yawG.rotation.y);
    setJoint('Joint_2', shoulderG.rotation.x);
    setJoint('Joint_3', elbowG.rotation.x);
    setJoint('Joint_4', wristG.rotation.z);
    setJoint('Joint_5', wristG.rotation.x);
  }
  }   // fin du bloc "pas figé"

  // Le câble se retrace après la pose. Figé : inutile de recalculer, sauf au
  // tout premier passage où le tube n'existe pas encore.
  if(urdfOn && urdfRoot){
    cableAcc += dt;
    // en mode économe (petit appareil / prefers-reduced-motion) on retrace
    // beaucoup moins souvent : le tracé coûte une géométrie neuve à chaque fois.
    const every = REDUCED ? 0.3 : CABLE.every;
    if(!cableMesh.length || (!frozen && cableAcc > every)){ cableAcc = 0; updateCables(); }
  }

  // Œil : couleur + pulsation + clignement
  const col = new THREE.Color(EYE_COLORS[brain.state]);
  eyeMat.color.lerp(col, 0.1); eyeMat.emissive.lerp(col, 0.1);
  glowSpr.material.color.lerp(col, 0.1); eyeLight.color.lerp(col, 0.1);
  const blinkPhase = Math.sin(clock*2.2);
  const doBlink = (!REDUCED && Math.sin(clock*0.7) > 0.985) ? 0.15 : 1;
  const pulse = brain.awake ? (0.85 + 0.15*Math.max(0,blinkPhase)) : 0.3;
  eyeMat.emissiveIntensity = 1.3*pulse*doBlink;
  glowSpr.material.opacity = (brain.awake?0.9:0.35)*pulse*doBlink;
  eyeLight.intensity = (brain.awake?0.7:0.15)*pulse*doBlink;
  glowSpr.scale.setScalar(0.8 + 0.1*Math.max(0,blinkPhase)*(brain.awake?1:0.3));

  // Pince : ouverture/fermeture douce selon l'humeur (positif = serré)
  if(fingers.length){
    const grip = (brain.awake?0.28:0.12)
      - (['happy','greet','curious'].includes(brain.state) ? 0.22 : 0)
      + (REDUCED ? 0 : Math.sin(clock*1.3)*0.04);
    for(const k of fingers) k.rotation.z = grip;
    if(urdfOn){
      // La pince est une timonerie : si on ne tourne que les deux pignons, les
      // bras de renvoi restent en place et les pièces semblent flotter.
      const a = Math.max(0, Math.min(1, (grip + 0.1) / 0.45)) * 0.5;
      setJoint('Gripper_Servo_Gear_Joint',       a);
      setJoint('Pivot_Arm_Gripper_Servo_Joint',  a);
      setJoint('Gripper_Idol_Gear_Joint',       -a);
      setJoint('Pivot_Arm_Gripper_Idol_Joint',  -a);
      // les embouts restent à leur position d'origine : les faire tourner
      // les détache visuellement du reste de la timonerie
    }
  }

  // Meters
  mE.style.width = (brain.energy*100)+'%';
  mC.style.width = (brain.curiosity*100)+'%';
  mB.style.width = (brain.boredom*100)+'%';

  // FX (focus caméra, pulsation, anneaux de scan) + caméra orbitale
  updateFx(dt);
  const s = orbit;
  camera.position.set(
    s.target.x + s.r*Math.sin(s.phi)*Math.sin(s.theta),
    s.target.y + s.r*Math.cos(s.phi),
    s.target.z + s.r*Math.sin(s.phi)*Math.cos(s.theta)
  );
  camera.lookAt(s.target);
  updateLeader(); updatePartHUD(); updateTelemetry();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function showHoverLabel(x,y,id){ const p=partById(id); if(!p){ hideHoverLabel(); return; } hlabel.textContent=p.name; hlabel.style.left=(x+16)+'px'; hlabel.style.top=(y+18)+'px'; hlabel.hidden=false; }
function hideHoverLabel(){ if(hlabel) hlabel.hidden=true; }

let dragging=false, lastX=0, lastY=0, moved=0;
/* Navigation : 1 doigt (ou souris) = tourner, 2 doigts = pincer pour zoomer et
   glisser pour se déplacer. Sans ça, sur téléphone il n'y a pas de zoom du tout
   puisque la molette n'existe pas. */
const ptrs = new Map();
let pinchDist = 0, pinchX = 0, pinchY = 0;
const ZMIN = 2.0, ZMAX = 40;
function zoomBy(f){ orbit.r = Math.max(ZMIN, Math.min(ZMAX, orbit.r * f)); }
/* Présentoir tournant : la caméra est verrouillée sur le bras (ou sur la pièce
   analysée). On ne déplace jamais la cible à la main, sinon on perd l'objet de
   vue, ce qui est vite ingérable au doigt. */
const _bc = new THREE.Vector3(), _bbox = new THREE.Box3();
function bodyCenter(){
  _bbox.makeEmpty();
  const src = (urdfOn && urdfRoot) ? urdfRoot : root;
  src.traverse(o=>{ if(o.isMesh && isShown(o) && o.userData.partId!=='eye') _bbox.expandByObject(o); });
  if(_bbox.isEmpty()) return _bc.set(0, 3, 0);
  return _bbox.getCenter(_bc);
}
function lockTarget(dt){
  const want = focusPart ? (partCenter(focusPart) || bodyCenter()) : bodyCenter();
  if(!want) return;
  const k = 1 - Math.pow(0.002, dt);          // recentrage doux
  orbit.target.lerp(want, k);
}
function twoFingerState(){
  const a = [...ptrs.values()];
  return { d: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y),
           x: (a[0].x+a[1].x)/2, y: (a[0].y+a[1].y)/2 };
}
canvas.addEventListener('pointerdown', e=>{
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  camTween=null; ensureAudio();                     // reprise du contrôle + déblocage audio
  canvas.setPointerCapture(e.pointerId);
  if(ptrs.size === 2){                              // passage à deux doigts
    dragging = false;
    const t = twoFingerState(); pinchDist = t.d; pinchX = t.x; pinchY = t.y;
  } else if(ptrs.size === 1){
    dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
    canvas.classList.add('dragging');
  }
});
canvas.addEventListener('pointercancel', e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchDist=0; });
canvas.addEventListener('pointermove', e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size >= 2){                               // pincer = zoom, glisser = déplacer
    const t = twoFingerState();
    if(pinchDist > 0 && t.d > 0) zoomBy(pinchDist / t.d);
    pinchDist = t.d; pinchX = t.x; pinchY = t.y;   // pincer zoome, sans déplacer
    hideHoverLabel();
    return;
  }
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    moved += Math.abs(dx)+Math.abs(dy);
    orbit.theta -= dx*0.0085;                       // tour complet, sans butée
    // 0.12 à 3.02 : on peut passer au-dessus et en dessous, en évitant les
    // pôles exacts où lookAt bascule brutalement.
    orbit.phi = Math.max(0.12, Math.min(3.02, orbit.phi - dy*0.0085));
    hideHoverLabel();
    return;
  }
  if(brain.awake){
    const nx = (e.clientX/window.innerWidth)*2-1;
    const ny = (e.clientY/window.innerHeight)*2-1;
    brain.attention.x = Math.max(-1,Math.min(1, nx*1.1));
    brain.attention.y = Math.max(-0.8,Math.min(0.8, ny*0.9));
    if(brain.state==='idle'){ setState('attentive'); }
    brain.lastInteract = clock; brain.boredom = Math.max(0, brain.boredom-dt0());
    if(server.connected) sendAttention();
  }
  if(clock - _hoverAt > 0.05){   // survol des pièces (throttle)
    _hoverAt = clock;
    const h = pickHit(e.clientX, e.clientY);
    setHover(h ? h.id : null);
    if(h){ showHoverLabel(e.clientX, e.clientY, h.id); canvas.style.cursor='pointer'; }
    else { hideHoverLabel(); canvas.style.cursor=''; }
  }
});
canvas.addEventListener('pointerleave', ()=>{ setHover(null); hideHoverLabel(); });
function dt0(){ return 0.004; }
canvas.addEventListener('pointerup', e=>{
  const wasPinching = ptrs.size >= 2;
  ptrs.delete(e.pointerId); if(ptrs.size < 2) pinchDist = 0;
  dragging=false; canvas.classList.remove('dragging');
  if(!wasPinching && moved < 6){ // clic simple
    const hit = pickHit(e.clientX, e.clientY);
    if(hit){ openPartHUD(hit.id, hit.point); return; }     // clic sur une pièce -> HUD d'analyse
    if(hudPart){ closePartHUD(); setIsolation(false,null); setFocus(null);
                 if(autoFroze) setFrozen(false,true); resetView(); return; }
    if(server.connected){ serverSend({type:'poke'}); }
    else { wake(true); log('reflexe','sollicité par contact'); setState('attentive'); brain.boredom = 0; }
  }
});

/* Persistance LOCALE (IndexedDB, repli localStorage) : tes modifs, photos et
   fiches PDF restent dans TON navigateur. Pas besoin de volume/serveur payant. */
const DB_NAME='aria', STORE='kv';
function _idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){
  try{ const db=await _idb(); return await new Promise((res,rej)=>{ const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  catch(_){ try{ return JSON.parse(localStorage.getItem('aria_'+k)||'null'); }catch(e){ return null; } }
}
async function idbSet(k,v){
  try{ const db=await _idb(); await new Promise((res,rej)=>{ const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); return true; }
  catch(_){ try{ localStorage.setItem('aria_'+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
}

let miniViewer=null;
function disposeMiniViewer(){ if(miniViewer){ try{ miniViewer.dispose(); }catch(_){} miniViewer=null; } }
function openMiniViewer(container, urls){
  disposeMiniViewer();
  if(!window.THREE || !THREE.STLLoader || !container) return;
  const w=container.clientWidth||320, hgt=container.clientHeight||220;
  const rnd=new THREE.WebGLRenderer({antialias:true, alpha:true});
  rnd.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); rnd.setSize(w,hgt);
  container.innerHTML=''; container.appendChild(rnd.domElement);
  const sc=new THREE.Scene(); if(scene.environment) sc.environment=scene.environment;
  const cam=new THREE.PerspectiveCamera(42, w/hgt, 0.5, 12000);
  sc.add(new THREE.HemisphereLight(0xcdddf5,0x141a22,1.0));
  const dl=new THREE.DirectionalLight(0xffffff,1.15); dl.position.set(1,1.5,1); sc.add(dl);
  const mat=new THREE.MeshStandardMaterial({color:0xdfe4ec, metalness:0.5, roughness:0.42, envMapIntensity:1.1});
  const grp=new THREE.Group(); sc.add(grp);
  const inner=new THREE.Group(); inner.rotation.x=-Math.PI/2; grp.add(inner);  // STL Z-up -> Y-up
  const loader=new THREE.STLLoader();
  let remaining=urls.length, any=false;
  urls.forEach(u=>loader.load(u, geo=>{ inner.add(new THREE.Mesh(geo,mat)); any=true; if(--remaining===0) fit(); },
                                    undefined, ()=>{ if(--remaining===0) fit(); }));
  function fit(){
    const n=container.querySelector('.mv-load'); if(n) n.remove();
    if(!any){ container.insertAdjacentHTML('beforeend','<div class="mv-load">modèle indisponible</div>'); return; }
    const bb=new THREE.Box3().setFromObject(inner), c=bb.getCenter(new THREE.Vector3()), s=bb.getSize(new THREE.Vector3());
    inner.position.set(-c.x,-c.y,-c.z);
    const rad=Math.max(s.x,s.y,s.z)||100; cam.position.set(0, rad*0.35, rad*1.9); cam.lookAt(0,0,0);
  }
  let rx=0.15, ry=0.5, drag=false, lx=0, ly=0, raf=0;
  const dom=rnd.domElement; dom.style.cursor='grab'; dom.style.touchAction='none';
  dom.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;dom.setPointerCapture(e.pointerId);});
  dom.addEventListener('pointermove',e=>{ if(!drag)return; ry+=(e.clientX-lx)*0.01; rx=Math.max(-1.4,Math.min(1.4,rx+(e.clientY-ly)*0.01)); lx=e.clientX;ly=e.clientY;});
  dom.addEventListener('pointerup',()=>drag=false);
  function loop(){ raf=requestAnimationFrame(loop); if(!drag) ry+=0.005; grp.rotation.y=ry; grp.rotation.x=rx; rnd.render(sc,cam); }
  loop();
  miniViewer={dispose(){ cancelAnimationFrame(raf); try{rnd.dispose();}catch(_){} if(rnd.domElement.parentNode) rnd.domElement.parentNode.removeChild(rnd.domElement); }};
}

function specsToText(o){ return o&&typeof o==='object'?Object.entries(o).map(([k,v])=>`${k}: ${v}`).join('\n'):''; }
function compToText(a){ return Array.isArray(a)?a.map(i=>`${i.name} | ${i.qty==null?1:i.qty}`).join('\n'):''; }
function wiresToText(a){ return Array.isArray(a)?a.map(i=>`${i.from} -> ${i.to} | ${i.type||''}`).join('\n'):''; }
function textToSpecs(t){ const o={}; (t||'').split('\n').forEach(l=>{ const i=l.indexOf(':'); if(i>0){ const k=l.slice(0,i).trim(), v=l.slice(i+1).trim(); if(k) o[k]=v; } }); return o; }
function textToComp(t){ return (t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [n,q]=l.split('|'); return {name:(n||'').trim(), qty:(q||'1').trim()}; }); }
function textToWires(t){ return (t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [c,tp]=l.split('|'); const [f,to]=(c||'').split('->'); return {from:(f||'').trim(), to:(to||'').trim(), type:(tp||'').trim()}; }); }

async function savePart(id){
  const merged = {...(partById(id)||{}), ...collectEdit(id)};
  const i=CATALOG.findIndex(p=>p.id===id); if(i>=0) CATALOG[i]=merged; else CATALOG.push(merged);
  if(catalogBackend){
    try{
      const r=await fetch('/api/parts/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)});
      if(r.ok){ const saved=await r.json(); const j=CATALOG.findIndex(p=>p.id===id); if(j>=0) CATALOG[j]=saved; renderView(saved); return; }
    }catch(_){}
  } else persist();
  renderView(partById(id)||merged);
}

function readImageCompressed(file, maxDim=1600, quality=0.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url);
      let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1, maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ res(cv.toDataURL('image/jpeg', quality)); }catch(e){ rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    img.src=url;
  });
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); }); }
function compressImageToBlob(file, maxDim=1600, quality=0.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url);
      let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=> b?res(b):rej(new Error('blob')), 'image/jpeg', quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    img.src=url;
  });
}

// Upload : serveur (/data) si servi par le cerveau, sinon navigateur.
async function uploadFile(id, kind, input, statusId){
  const f=input.files&&input.files[0]; if(!f) return;
  const st=document.getElementById(statusId); if(st) st.textContent='traitement...';
  try{
    if(catalogBackend){
      let blob=f, filename=f.name||(kind==='photo'?'photo.jpg':'fiche.pdf');
      if(kind==='photo'){ blob=await compressImageToBlob(f); filename='photo.jpg'; }
      else if(f.size>12*1024*1024){ if(st) st.textContent='PDF trop lourd (>12 Mo)'; return; }
      const fd=new FormData(); fd.append('kind',kind); fd.append('file', blob, filename);
      if(st) st.textContent='envoi...';
      const r=await fetch('/api/parts/'+encodeURIComponent(id)+'/upload',{method:'POST',body:fd});
      if(r.ok){ const {url}=await r.json(); const p=partById(id); if(p) p[kind]=url; if(st) st.textContent=(kind==='photo'?'photo':'PDF')+' envoyé ✓'; }
      else if(st) st.textContent='erreur '+r.status;
      return;
    }
    let dataUrl;
    if(kind==='photo'){ dataUrl = await readImageCompressed(f); }
    else { if(f.size>8*1024*1024){ if(st) st.textContent='PDF trop lourd (>8 Mo)'; return; } dataUrl = await readAsDataURL(f); }
    const p=partById(id); if(p){ p[kind]=dataUrl; persist(); }
    if(st) st.textContent=(kind==='photo'?'photo':'PDF')+' enregistré ✓';
  }catch(e){ if(st) st.textContent='erreur (fichier illisible)'; }
}

/* ---------- Mémoire d'ARIA (serveur /data) ---------- */
function memAgo(ts){
  const d=Math.max(0,(Date.now()/1000)-(ts||0));
  if(d<60) return "à l'instant";
  if(d<3600) return Math.floor(d/60)+' min';
  if(d<86400) return Math.floor(d/3600)+' h';
  return Math.floor(d/86400)+' j';
}
async function openMemory(){
  disposeMiniViewer();
  let m=null;
  try{ const r=await fetch('/api/memory',{cache:'no-store'}); if(r.ok) m=await r.json(); }catch(_){}
  let h = `<div class="sheet-head"><h2>Mémoire d'ARIA</h2><button class="x" data-act="close">✕</button></div><div class="sheet-body">`;
  if(!m){
    h += `<div class="blk"><p>Mémoire indisponible : elle vit sur le serveur (/data).</p></div></div>`;
    sheetEl.innerHTML=h; sheetEl.classList.add('open'); return;
  }
  const facts=m.facts||{}, notes=m.notes||[], events=m.events||[];
  const nf=Object.keys(facts).length;
  h += `<div class="ronote" style="color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.03)">`+
       `${nf} fait${nf>1?'s':''} · ${notes.length} note${notes.length>1?'s':''} · ${events.length} échange${events.length>1?'s':''} gardés. Dis-lui « je m'appelle... » ou « retiens que... » pour la nourrir.</div>`;

  h += `<div class="blk"><h3>Ce qu'elle sait de toi</h3>`;
  if(nf){
    h += `<div class="memlist">`;
    for(const [k,v] of Object.entries(facts))
      h += `<div class="memrow"><span class="mk">${esc(k)}</span><span class="mv">${esc(v.v)}</span>`+
           `<button class="mx" data-act="mem-forget-fact" data-key="${esc(k)}" title="oublier">✕</button></div>`;
    h += `</div>`;
  } else h += `<p style="color:var(--dim)">Rien encore. Présente-toi !</p>`;
  h += `</div>`;

  h += `<div class="blk"><h3>Ce qu'elle doit retenir</h3>`;
  if(notes.length){
    h += `<div class="memlist">`;
    notes.forEach((n,i)=>{
      h += `<div class="memrow"><span class="mv" style="flex:1">${esc(n.t)}</span>`+
           `<span class="mt">${memAgo(n.ts)}</span>`+
           `<button class="mx" data-act="mem-forget-note" data-index="${i}" title="oublier">✕</button></div>`;
    });
    h += `</div>`;
  } else h += `<p style="color:var(--dim)">Aucune note.</p>`;
  h += `<button class="filebtn" data-act="mem-add" style="width:100%;justify-content:center;margin-top:8px">➕ Ajouter une note</button></div>`;

  if(events.length){
    h += `<div class="blk"><h3>Échanges récents</h3><div class="memlog">`;
    for(const e of events.slice(-14))
      h += `<div class="mlrow ${e.r==='user'?'me':'aria'}"><span class="who">${e.r==='user'?'toi':'ARIA'}</span><span>${esc(e.t)}</span></div>`;
    h += `</div></div>`;
  }

  h += `<div class="blk"><button class="filebtn" data-act="mem-clear" style="width:100%;justify-content:center;color:#ff8b8b;border-color:rgba(255,139,139,.35)">🗑 Tout oublier</button></div>`;
  h += `</div>`;
  sheetEl.innerHTML = h; sheetEl.classList.add('open');
}
async function memForgetFact(key){
  try{ await fetch('/api/memory/fact/'+encodeURIComponent(key),{method:'DELETE'}); }catch(_){}
  log('etat','oublié : '+key); openMemory();
}
async function memForgetNote(i){
  try{ await fetch('/api/memory/note/'+encodeURIComponent(i),{method:'DELETE'}); }catch(_){}
  openMemory();
}
async function memClear(){
  try{ await fetch('/api/memory/clear',{method:'POST'}); }catch(_){}
  log('etat','mémoire effacée'); openMemory();
}
async function memAddNote(){
  const t=prompt('Que doit-elle retenir ?'); if(!t||!t.trim()) return;
  try{ await fetch('/api/memory/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.trim()})}); }catch(_){}
  openMemory();
}

sheetEl.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-open],[data-open-edit]'); if(!t) return;
  if(t.dataset.open){ openPartSheet(t.dataset.open); return; }
  if(t.dataset.openEdit){ const p=partById(t.dataset.openEdit); if(p) renderEdit(p); return; }
  const a=t.dataset.act;
  if(a==='close') closeSheet();
  else if(a==='catalogue') openCatalogue();
  else if(a==='new') newPart();
  else if(a==='reset') resetCatalog();
  else if(a==='save') savePart(t.dataset.id);
  else if(a==='del'){ if(confirm('Supprimer cette pièce ?')) deletePart(t.dataset.id); }
  else if(a==='memory') openMemory();
  else if(a==='mem-forget-fact') memForgetFact(t.dataset.key);
  else if(a==='mem-forget-note') memForgetNote(t.dataset.index);
  else if(a==='mem-clear'){ if(confirm("Tout effacer ? ARIA oubliera tout ce qu'elle sait de toi.")) memClear(); }
  else if(a==='mem-add') memAddNote();
});

// Sons d'interface synthétisés (aucun fichier, respecte l'autoplay : démarre au 1er clic)
let audioCtx = null, soundOn = true;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function tone(freq, dur, type, gain){
  if(!soundOn || !audioCtx) return;
  const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain||0.04,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
}
function sfx(name){
  if(!soundOn || !audioCtx) return;
  if(name==='hover') tone(880,0.05,'sine',0.015);
  else if(name==='focus'){ tone(620,0.09,'triangle',0.05); setTimeout(()=>tone(960,0.12,'triangle',0.04),70); }
  else if(name==='close'){ tone(520,0.08,'sine',0.04); setTimeout(()=>tone(340,0.12,'sine',0.03),55); }
  else if(name==='click') tone(700,0.05,'square',0.025);
}

// Ligne de connexion pièce -> fiche (projection 3D -> écran)
const _leader=document.getElementById('leader'), _lLine=document.getElementById('leaderLine'),
      _lDot=document.getElementById('leaderDot'), _lAnc=document.getElementById('leaderAnchor');
/* ---------- HUD d'analyse : les infos flottent autour de la pièce ----------
   Les cartouches sont du DOM positionné en projetant un point 3D de la pièce
   à chaque image. L'anneau est dimensionné sur la sphère englobante réelle,
   donc il colle à la pièce quel que soit le zoom. */
const hud3d=document.getElementById('hud3d'), hudSvg=document.getElementById('hudSvg'),
      hudCards=document.getElementById('hudCards');
let hudPart=null, hudItems=[], hudT=0;

function partSphere(id){
  const ms=meshesOf(id).filter(isShown);
  if(!ms.length) return null;
  const box=new THREE.Box3();
  ms.forEach(m=>box.expandByObject(m));
  if(box.isEmpty()) return null;
  return { c: box.getCenter(new THREE.Vector3()),
           r: Math.max(0.25, box.getSize(new THREE.Vector3()).length()*0.5) };
}

function hudCard(html, cls){
  const d=document.createElement('div');
  d.className='hcard'+(cls?' '+cls:''); d.innerHTML=html;
  hudCards.appendChild(d); return d;
}

function openPartHUD(id, point){
  const p=partById(id); if(!p){ openCatalogue(); return; }
  closePartHUD();
  hudPart=id;
  if(!frozen) setFrozen(true, true);        // immobile le temps de l'analyse
  setFocus(id); setIsolation(true, id);
  const sph0=partSphere(id);
  if(point){ focusOn(point, sph0 ? Math.max(3.6, sph0.r*3.4) : null); scanRing(point); }
  sfx('focus');

  const cat=p.category||'achat';
  const tight = window.innerWidth < 560;   // sur téléphone, on garde l'essentiel
  // Cartouche titre
  hudItems.push({ a:-150, el: hudCard(
    `<h4>${esc(p.name)}</h4><div class="cat">${esc(CAT_LABEL[cat]||cat)}</div>`+
    (p.role?`<p style="margin-top:6px">${esc(p.role)}</p>`:'')+
    `<button data-act="full">FICHE COMPLÈTE</button>`, 'title') });

  // Caractéristiques
  const sp=p.specs&&Object.keys(p.specs).length
    ? Object.entries(p.specs).map(([k,v])=>`<div class="hr"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('') : '';
  if(sp) hudItems.push({ a:-35, el: hudCard('<h4>Caractéristiques</h4>'+sp) });

  // Composants
  if(Array.isArray(p.components)&&p.components.length)
    hudItems.push({ a:40, el: hudCard('<h4>Composants</h4>'+
      p.components.slice(0, tight?3:5).map(c=>`<div class="hr"><span>${esc(c.name)}</span><span>×${esc(c.qty==null?1:c.qty)}</span></div>`).join('')) });

  // Fils & connecteurs
  if(!tight && Array.isArray(p.wires)&&p.wires.length)
    hudItems.push({ a:135, el: hudCard('<h4>Fils</h4>'+
      p.wires.slice(0,4).map(w=>`<div class="hr"><span>${esc(w.from)} → ${esc(w.to)}</span><span>${esc(w.type||'')}</span></div>`).join('')) });

  // Impression 3D
  const pr=p.print&&Object.keys(p.print).length
    ? Object.entries(p.print).map(([k,v])=>`<div class="hr"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('') : '';
  if(pr && !tight) hudItems.push({ a:-105, el: hudCard('<h4>Impression 3D</h4>'+pr) });

  hud3d.hidden=false; document.body.classList.add('analysing');
  updatePartHUD();
}

function closePartHUD(){
  document.body.classList.remove('analysing');
  hudItems.forEach(i=>i.el.remove()); hudItems=[];
  hudSvg.innerHTML=''; hud3d.hidden=true; hudPart=null;
}

function svgEl(tag, attrs){
  const e=document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function updatePartHUD(){
  if(!hudPart){ return; }
  const sph=partSphere(hudPart);
  if(!sph){ hud3d.hidden=true; return; }
  camera.updateMatrixWorld();
  const W=window.innerWidth, H=window.innerHeight;
  const c=sph.c.clone().project(camera);
  if(c.z>1){ hud3d.hidden=true; return; }        // derrière la caméra
  hud3d.hidden=false;
  const sx=(c.x*0.5+0.5)*W, sy=(-c.y*0.5+0.5)*H;
  // rayon à l'écran : on projette un point décalé du rayon réel
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const e=sph.c.clone().addScaledVector(right, sph.r).project(camera);
  const lim=Math.min(W,H);
  const sr=Math.max(34, Math.min(lim*0.19, Math.hypot((e.x*0.5+0.5)*W-sx, (-e.y*0.5+0.5)*H-sy)));

  hudSvg.innerHTML='';
  hudT+=0.004;
  // anneaux : un plein, deux arcs qui tournent lentement
  hudSvg.appendChild(svgEl('circle',{cx:sx,cy:sy,r:sr,class:'ringline','stroke-opacity':.45}));
  const R2=sr*1.22, a0=hudT, arc=(from,len,rad)=>{
    const x1=sx+Math.cos(from)*rad, y1=sy+Math.sin(from)*rad;
    const x2=sx+Math.cos(from+len)*rad, y2=sy+Math.sin(from+len)*rad;
    return svgEl('path',{d:`M ${x1} ${y1} A ${rad} ${rad} 0 ${len>Math.PI?1:0} 1 ${x2} ${y2}`, class:'ringline'});
  };
  hudSvg.appendChild(arc(a0, 2.1, R2));
  hudSvg.appendChild(arc(a0+Math.PI, 1.5, R2));
  for(let i=0;i<12;i++){                                  // graduations
    const a=a0*-0.6 + i/12*Math.PI*2;
    hudSvg.appendChild(svgEl('line',{x1:sx+Math.cos(a)*(sr*1.34), y1:sy+Math.sin(a)*(sr*1.34),
      x2:sx+Math.cos(a)*(sr*1.42), y2:sy+Math.sin(a)*(sr*1.42), class:'tick'}));
  }
  hudSvg.appendChild(svgEl('circle',{cx:sx,cy:sy,r:2.5,class:'node'}));

  // cartouches disposés en couronne, tirés par un trait
  const dist=sr*1.15+72;
  hudItems.forEach(it=>{
    const a=it.a*Math.PI/180;
    let x=sx+Math.cos(a)*dist, y=sy+Math.sin(a)*dist*0.82;
    const w=it.el.offsetWidth||150, h=it.el.offsetHeight||60;
    x=Math.max(w/2+8, Math.min(W-w/2-8, x));            // reste à l'écran
    y=Math.max(h/2+8, Math.min(H-h/2-8, y));
    it.el.style.left=x+'px'; it.el.style.top=y+'px';
    const dx=sx-x, dy=sy-y, L=Math.hypot(dx,dy)||1;
    const ex=x+dx/L*(w/2+6), ey=y+dy/L*(h/2+6);          // bord du cartouche
    const tx=sx-dx/L*sr*1.05, ty=sy-dy/L*sr*1.05;        // bord de l'anneau
    hudSvg.appendChild(svgEl('line',{x1:ex,y1:ey,x2:tx,y2:ty,class:'lead'}));
    hudSvg.appendChild(svgEl('circle',{cx:ex,cy:ey,r:2,class:'node'}));
  });
}

hudCards.addEventListener('click', e=>{
  const b=e.target.closest('[data-act="full"]'); if(!b||!hudPart) return;
  const id=hudPart; closePartHUD(); openPartSheet(id);
});

function updateLeader(){
  if(!_leader) return;
  if(window.innerWidth<900 || !sheetEl.classList.contains('open') || !focusPart){ _leader.style.opacity=0; return; }
  const c=partCenter(focusPart); if(!c){ _leader.style.opacity=0; return; }
  camera.updateMatrixWorld(); c.project(camera);
  if(c.z>1){ _leader.style.opacity=0; return; }   // derrière la caméra
  const sx=(c.x*0.5+0.5)*window.innerWidth, sy=(-c.y*0.5+0.5)*window.innerHeight;
  const rect=sheetEl.getBoundingClientRect(), ax=rect.right, ay=rect.top+52;
  _leader.style.opacity=1;
  _lLine.setAttribute('x1',ax); _lLine.setAttribute('y1',ay); _lLine.setAttribute('x2',sx); _lLine.setAttribute('y2',sy);
  _lDot.setAttribute('cx',sx); _lDot.setAttribute('cy',sy); _lAnc.setAttribute('cx',ax); _lAnc.setAttribute('cy',ay);
}
